# Publica o app no GitHub Pages.
#
# O passo "configure-pages" liga o Pages sozinho na primeira execução
# (enablement: true), então não é preciso mexer em nenhuma configuração
# à mão. Só entra no site o que o app precisa para rodar.

name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir -p site
          cp index.html manifest.webmanifest sw.js minha-rotina.html site/
          cp -r assets js site/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: publicacao
        uses: actions/deploy-pages@v4
