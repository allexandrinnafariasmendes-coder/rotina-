  <script>
/* Tela "Assistente": conversa simples que organiza o dia usando o motor local.
   Não há inteligência remota aqui — são regras rodando no seu aparelho. */
(function () {
  'use strict';

  var App = window.App;
  var u = App.util, el = u.el, ui = App.ui;

  var conversa = [];
  var pendente = null;   /* pergunta em aberto, ex.: quantos minutos você tem */

  var ATALHOS = [
    { texto: 'Organize meu dia', acao: 'organizar' },
    { texto: 'O que faço agora?', acao: 'agora' },
    { texto: 'Meu dia está cheio demais', acao: 'cheio' },
    { texto: 'Estou atrasada', acao: 'atrasada' },
    { texto: 'Quero descansar', acao: 'descanso' },
    { texto: 'O dia não saiu como planejei', acao: 'saidas' }
  ];

  function falar(quem, texto, tipo, dados) {
    conversa.push({ quem: quem, texto: texto, tipo: tipo || 'texto', dados: dados || null });
  }

  function limpar() { conversa = []; pendente = null; }

  /* ------------------------------------------------ respostas - */

  /* Descobre o dia mencionado na frase. */
  function diaDaFrase(texto) {
    var t = u.simples(texto);
    if (/amanha/.test(t)) return u.somarDias(u.hoje(), 1);
    if (/depois de amanha/.test(t)) return u.somarDias(u.hoje(), 2);
    var nomes = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
    for (var i = 0; i < nomes.length; i++) {
      if (new RegExp('\\b' + nomes[i]).test(t)) {
        var atual = u.diaDaSemana(u.hoje());
        var passos = (i - atual + 7) % 7 || 7;
        return u.somarDias(u.hoje(), passos);
      }
    }
    return u.hoje();
  }

  function responderTexto(store, texto) {
    var motor = App.motor;

    if (pendente === 'minutos') {
      var min = parseInt(texto.replace(/\D+/g, ''), 10);
      pendente = null;
      if (!min) { falar('app', 'Não entendi o tempo. Tente algo como “40 minutos”.'); return; }
      return sugerirAgora(store, min);
    }

    var iso = diaDaFrase(texto);
    var r = motor.planejarTexto(texto, iso);

    if (!r.itens.length) {
      falar('app', 'Ainda não consegui entender essa frase. Tente descrever o que você precisa fazer, ' +
        'com tempo ou horário — por exemplo: “amanhã tenho aula até meio-dia, quero estudar duas horas e arrumar o quarto”.');
      return;
    }

    falar('app', 'Montei uma distribuição para ' + u.dataRelativa(iso) + '. Gostou?', 'plano', { iso: iso, plano: r.plano });
  }

  function sugerirAgora(store, minutos) {
    var lista = App.motor.melhorAgora(minutos);
    if (!lista.length) {
      falar('app', 'Não achei nada que caiba em ' + minutos + ' minutos. Talvez seja um bom momento para descansar.');
      return;
    }
    falar('app', 'Com ' + minutos + ' minutos, eu faria assim:', 'sugestoes', { minutos: minutos, lista: lista });
  }

  function responderAcao(store, acao) {
    var motor = App.motor;
    var hoje = u.hoje();

    if (acao === 'organizar') {
      falar('app', 'Me conte como é o seu dia. Escreva de um jeito solto, por exemplo: ' +
        '“amanhã tenho aula até meio-dia, quero estudar duas horas, preciso arrumar meu quarto e quero descansar”.');

    } else if (acao === 'agora') {
      pendente = 'minutos';
      falar('app', 'Quanto tempo você tem agora?', 'minutos');

    } else if (acao === 'cheio') {
      var itens = motor.itensDoDia(hoje);
      var tarefas = motor.tarefasDoDia(hoje);
      var total = itens.reduce(function (s, i) { return s + (i.duracao || 0); }, 0)
        + tarefas.reduce(function (s, t) { return s + (t.estimativa || 30); }, 0);

      falar('app', 'Hoje você tem ' + u.plural(itens.length, 'atividade', 'atividades') + ' e ' +
        u.plural(tarefas.length, 'tarefa', 'tarefas') + ', somando cerca de ' + u.horasTexto(total) + '. ' +
        (tarefas.length ? 'Vamos decidir o que fica?' : 'A agenda em si já está cheia — dá para adiar algum compromisso?'),
        'triagem', { iso: hoje });

    } else if (acao === 'saidas') {
      var alt = store.estado.alternativas;
      falar('app', alt.length
        ? 'Está tudo bem. Foi para isso que você escreveu estas saídas:'
        : 'Você ainda não escreveu suas alternativas. Dá para criá-las em Ajustes — são as saídas para os dias que não saem como o planejado.',
        alt.length ? 'saidas' : 'texto', { lista: alt });

    } else if (acao === 'atrasada') {
      var restantes = motor.itensDoDia(hoje).filter(function (i) {
        var m = u.minutosDe(i.hora);
        return !i.feito && m !== null && m >= u.agoraMin();
      });
      var comSaidas = store.estado.alternativas.length;
      falar('app', restantes.length
        ? 'Tudo bem. Ainda faltam ' + u.plural(restantes.length, 'atividade', 'atividades') + ' hoje e ' +
          u.horasTexto(Math.max(0, motor.dormir() - u.agoraMin())) + ' até a hora de dormir. ' +
          'Escolha o essencial e deixe o resto para amanhã — a lista existe para servir você, não o contrário.'
        : 'Não sobrou nada marcado para hoje. Respire: o dia pode acabar aqui.',
        'triagem', { iso: hoje });
      if (comSaidas) falar('app', 'E lembre-se das suas saídas para os dias assim:', 'saidas', { lista: store.estado.alternativas });

    } else if (acao === 'descanso') {
      var quando = motor.reservarDescanso(hoje, 30);
      falar('app', quando
        ? 'Reservei 30 minutos de descanso às ' + quando + '. Está no seu dia agora.'
        : 'Seu dia não tem nenhum espaço livre de 30 minutos. Quer adiar alguma coisa para abrir espaço?');
      App.render();
    }
  }

  /* ------------------------------------------------ desenho --- */

  function desenharPlano(store, dados) {
    var novos = dados.plano.filter(function (p) { return p.origem !== 'existente'; }).length;

    return el('div', {}, [
      el('div', {}, dados.plano.map(function (p) {
        var area = store.AREAS[p.area];
        var classe = 'div.plano-linha' + (p.origem === 'existente' ? '.plano-linha--existente' : '.plano-linha--novo');
        return el(classe, {}, [
          el('span.plano-linha__hora', { text: u.faixa(p.hora, p.duracao) }),
          el('div', { style: 'flex:1' }, [
            el('div', { text: p.titulo }),
            el('div.item__meta', {}, [
              ui.ponto(area.cor),
              el('span', { text: area.nome }),
              p.origem === 'movido' ? ui.etiqueta('remarcado', 'dourada') : null,
              p.origem === 'cuidado' ? ui.etiqueta('descanso reservado', 'salvia') : null,
              p.origem === 'pausa' ? ui.etiqueta('pausa', 'salvia') : null
            ].filter(Boolean))
          ])
        ]);
      })),
      el('div.linha-btn', { style: 'margin-top:12px' }, [
        el('button.btn.btn--principal.btn--p', {
          type: 'button', text: 'Gostei, aplicar',
          onclick: function () {
            App.motor.aplicarPlano(dados.iso, dados.plano, false);
            falar('app', 'Aplicado em ' + u.dataRelativa(dados.iso) + '. Você pode ajustar tudo na Agenda.');
            ui.aviso('Plano aplicado');
            App.render();
          }
        }),
        el('button.btn.btn--suave.btn--p', {
          type: 'button', text: 'Substituir a rotina do dia',
          onclick: function () {
            App.motor.aplicarPlano(dados.iso, dados.plano, true);
            falar('app', 'Feito: em ' + u.dataRelativa(dados.iso) + ' vale só este plano.');
            ui.aviso('Dia replanejado');
            App.render();
          }
        }),
        el('button.btn.btn--fantasma.btn--p', {
          type: 'button', text: 'Descartar',
          onclick: function () {
            falar('app', 'Sem problema. Me diga de outro jeito e eu tento de novo.');
            App.render();
          }
        })
      ]),
      el('p.mini.fraco', { style: 'margin-top:8px',
        text: novos + (novos === 1 ? ' item novo' : ' itens novos') + '; o resto já estava no seu dia.' })
    ]);
  }

  function desenharSugestoes(store, dados) {
    return el('div', {}, dados.lista.map(function (c) {
      var area = store.AREAS[c.area];
      return el('div.sugestao', {}, [
        el('div', {}, [
          el('div.item__titulo', { text: c.titulo }),
          el('div.item__meta', {}, [ui.ponto(area.cor), el('span', { text: u.duracaoTexto(c.minutos) })])
        ]),
        c.tipo === 'estudo' ? el('button.btn.btn--p.btn--principal', {
          type: 'button', text: 'Começar',
          onclick: function () {
            var d = store.disciplinaDoTopico(c.ref.id);
            store.commit(function (s) {
              s.sessaoAtiva = { disciplinaId: d ? d.id : null, topicoId: c.ref.id, inicio: Date.now() };
            });
            location.hash = '#/estudos';
          }
        }) : (c.tipo === 'tarefa' ? el('button.btn.btn--p.btn--suave', {
          type: 'button', text: 'Concluir',
          onclick: function () {
            store.commit(function () { c.ref.feita = true; });
            ui.aviso('Feito!');
            App.render();
          }
        }) : null),
        el('div.sugestao__porque', { text: 'Por quê: ' + c.porque + '.' })
      ]);
    }));
  }

  function desenharTriagem(store, dados) {
    var tarefas = App.motor.tarefasDoDia(dados.iso)
      .sort(function (a, b) { return b.prioridade - a.prioridade; });

    if (!tarefas.length) return el('p.mini.fraco', { text: 'Nenhuma tarefa aberta para hoje.' });

    return el('div', {}, tarefas.map(function (t) {
      return el('div.sugestao', {}, [
        el('div', {}, [
          el('div.item__titulo', { text: t.titulo }),
          el('div.item__meta', {}, [
            el('span', { style: 'color:var(--rubrica)', text: new Array(t.prioridade + 1).join('★') }),
            el('span', { text: u.duracaoTexto(t.estimativa) })
          ])
        ]),
        el('div.linha-btn', {}, [
          el('button.btn.btn--p.btn--suave', {
            type: 'button', text: '→ adiar',
            title: 'Passar para amanhã',
            onclick: function () {
              store.commit(function () { t.data = u.somarDias(t.data || u.hoje(), 1); });
              ui.aviso('Adiada para amanhã');
              App.render();
            }
          }),
          el('button.btn.btn--p.btn--perigo', {
            type: 'button', text: '× tirar',
            onclick: function () {
              store.commit(function (s) { s.tarefas = s.tarefas.filter(function (x) { return x.id !== t.id; }); });
              ui.aviso('Tirada da lista');
              App.render();
            }
          })
        ])
      ]);
    }).concat([
      el('p.mini.fraco', { style: 'margin-top:10px',
        text: 'Adiar não é falhar. Um dia com menos coisas costuma render mais que um dia impossível.' })
    ]));
  }

  function desenharSaidas(dados) {
    return el('div', {}, (dados.lista || []).map(function (a) {
      return el('div.plano-linha', {}, [
        el('div', {}, [
          el('div', { style: 'font-family:var(--serif)', text: a.quando }),
          el('div.mini.sub', { text: a.saida })
        ])
      ]);
    }));
  }

  function desenharMinutos(store) {
    return el('div.linha-btn', {}, [15, 30, 45, 60, 90].map(function (m) {
      return el('button.btn.btn--p.btn--suave', {
        type: 'button', text: m + ' min',
        onclick: function () {
          pendente = null;
          falar('eu', 'Tenho ' + m + ' minutos');
          sugerirAgora(store, m);
          App.render();
        }
      });
    }));
  }

  function balao(store, msg) {
    if (msg.quem === 'eu') return el('div.balao.balao--eu', { text: msg.texto });

    var extra = null;
    if (msg.tipo === 'plano') extra = desenharPlano(store, msg.dados);
    else if (msg.tipo === 'sugestoes') extra = desenharSugestoes(store, msg.dados);
    else if (msg.tipo === 'triagem') extra = desenharTriagem(store, msg.dados);
    else if (msg.tipo === 'minutos') extra = desenharMinutos(store);
    else if (msg.tipo === 'saidas') extra = desenharSaidas(msg.dados);

    return el('div.balao.balao--app', { style: extra ? 'max-width:100%' : null }, [
      el('div', { text: msg.texto }),
      extra ? el('div', { style: 'margin-top:12px' }, [extra]) : null

  App.views = App.views || {};
  App.views.assistente = {
    titulo: 'Assistente',
    aoEntrar: function (params, store) {
      if (params && params.modo === 'reorganizar') {

        falar('eu', 'Meu dia está cheio demais');
        responderAcao(store, 'cheio');
      }
      if (!conversa.length) {
        falar('app', 'Oi! Posso organizar seu dia, sugerir o que fazer agora ou ajudar a tirar peso da sua lista. ' +

          el('div', { style: 'display:flex;gap:8px' }, [

/* Tela "Ajustes": preferências, backup e recomeço. */
(function () {
  'use strict';

  var App = window.App;
  var u = App.util, el = u.el, ui = App.ui;

  function baixarBackup(store) {
    var nome = 'minha-rotina-' + u.hoje() + '.json';
    var blob = new Blob([store.exportar()], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: nome });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    ui.aviso('Backup salvo: ' + nome);
  }

  function restaurarBackup(store) {
    var input = el('input', { type: 'file', accept: 'application/json,.json' });
    input.style.display = 'none';
    input.addEventListener('change', function () {
      var arquivo = input.files && input.files[0];
      if (!arquivo) return;
      var leitor = new FileReader();
      leitor.onload = function () {
        try {
          store.importar(String(leitor.result));
          App.aplicarTema();
          ui.aviso('Backup restaurado');
          App.render();
        } catch (e) { ui.aviso('Arquivo inválido'); }
      };
      leitor.readAsText(arquivo);
    });
    document.body.appendChild(input);
    input.click();
    setTimeout(function () { input.remove(); }, 0);
  }

  /* Editor das alternativas: "se acontecer X, faça Y". */
  function formAlternativa(store, alt) {
    var novo = !alt;
    ui.abrirFormulario({
      titulo: novo ? 'Nova saída' : 'Editar saída',
      valores: alt || { quando: '', saida: '' },
      campos: [
        { nome: 'quando', rotulo: 'Quando', tipo: 'texto', obrigatorio: true, dica: 'Se não conseguir estudar…' },
        { nome: 'saida', rotulo: 'O que fazer', tipo: 'texto-longo', obrigatorio: true,
          dica: 'Faça uma leitura espiritual ou revise anotações.' }
      ],
      aoExcluir: novo ? null : function () {
        store.commit(function (st) {
          st.alternativas = st.alternativas.filter(function (x) { return x.id !== alt.id; });
        });
        App.render();
      },
      aoSalvar: function (v) {
        store.commit(function (st) {
          if (novo) st.alternativas.push({ id: u.id(), quando: v.quando, saida: v.saida });
          else Object.assign(alt, { quando: v.quando, saida: v.saida });
        });
        App.render();
      }
    });
  }

  function formPrioridades(store) {
    ui.abrirFormulario({
      titulo: 'Minhas prioridades',
      valores: { lista: (store.estado.ajustes.prioridades || []).map(function (t) { return { titulo: t }; }) },
      campos: [{ nome: 'lista', rotulo: 'O que vem primeiro', tipo: 'lista',
        ajuda: 'Poucas linhas. São elas que decidem o que fica quando o dia aperta.' }],
      aoSalvar: function (v) {
        store.commit(function (st) {
          st.ajustes.prioridades = v.lista.map(function (i) { return i.titulo; });
        });
        ui.aviso('Prioridades guardadas');
        App.render();
      }
    });
  }

  function bloco(titulo, descricao, filhos) {
    return el('div.cartao.pilha.pilha--junta', {}, [
      el('div.item__titulo', { text: titulo }),
      descricao ? el('p.mini.sub', { text: descricao }) : null,
      el('div.linha-btn', {}, filhos)
    ].filter(Boolean));
  }

  var SECOES = [
    { chave: 'objetivos', nome: 'Objetivos' },
    { chave: 'estudos', nome: 'Estudos' },
    { chave: 'autocuidado', nome: 'Autocuidado' },
    { chave: 'espiritual', nome: 'Vida espiritual' }
  ];

  App.views = App.views || {};
  App.views.ajustes = {
    titulo: 'Ajustes',
    render: function (store) {
      var a = store.estado.ajustes;
      var e = store.estado;

      var campoNome = el('input', {
        type: 'text', value: a.nome, placeholder: 'Como você quer ser chamada?', 'aria-label': 'Seu nome',
        onchange: function () {
          var v = campoNome.value.trim();
          store.commit(function (s) { s.ajustes.nome = v; });
          ui.aviso('Prontinho');
        }
      });

      var campoLema = el('input', {
        type: 'text', value: a.lema, placeholder: store.exemploDeLema(), 'aria-label': 'Lema',
        onchange: function () {
          var v = campoLema.value.trim();
          store.commit(function (st) { st.ajustes.lema = v; });
          ui.aviso('Lema guardado');
          App.render();
        }
      });

      function campoHora(chave, rotulo) {
        var input = el('input', {
          type: 'time', value: a[chave], 'aria-label': rotulo,
          onchange: function () {
            var v = input.value;
            store.commit(function (s) { s.ajustes[chave] = v; });
            ui.aviso('Horário salvo');
          }
        });
        return el('div.campo', {}, [el('label', { text: rotulo }), input]);
      }

      return el('div.pilha', { style: 'margin-top:8px' }, [
        el('div.cartao.pilha.pilha--junta', {}, [
          el('div.item__titulo', { text: 'Seu nome' }),
          el('div.campo', {}, [campoNome]),
          el('p.mini.fraco', { text: 'Usado só na saudação da tela Hoje.' })
        ]),

        el('div.cartao.pilha.pilha--junta', {}, [
          el('div.item__titulo', { text: 'Meus horários' }),
          el('p.mini.sub', { text: 'O assistente usa esses limites para saber onde cabe cada coisa.' }),
          el('div.duo', {}, [campoHora('acordar', 'Costumo acordar'), campoHora('dormir', 'Costumo dormir')])
        ]),

        el('div.cartao.pilha.pilha--junta', {}, [
          el('div.item__titulo', { text: 'Lema' }),
          el('p.mini.sub', { text: 'Aparece no alto da tela Hoje, todos os dias.' }),
          el('div.campo', {}, [campoLema]),
          el('p.mini.fraco', { text: 'Em branco, o app mostra uma frase suave diferente a cada dia.' })
        ]),

        el('div.cartao.pilha.pilha--junta', {}, [
          el('div.item__titulo', { text: 'Prioridades' }),
          el('p.mini.sub', { text: (a.prioridades && a.prioridades.length)
            ? a.prioridades.join(' · ') : 'Ainda não há prioridades escritas.' }),
          el('div.linha-btn', {}, [
            el('button.btn.btn--p', { type: 'button', text: 'Editar prioridades',
              onclick: function () { formPrioridades(store); } })
          ])
        ]),

        el('div.cartao.pilha.pilha--junta', {}, [
          el('div.item__titulo', { text: 'Alternativas e saídas' }),
          el('p.mini.sub', { text: 'O que fazer quando o dia não sai como o planejado. Aparecem na tela Hoje e no assistente.' }),
          el('div.pilha.pilha--junta', {}, store.estado.alternativas.map(function (alt) {
            return el('div', { style: 'cursor:pointer;padding:8px 0;border-bottom:1px solid var(--filete)',
              onclick: function () { formAlternativa(store, alt); } }, [
              el('div', { style: 'font-family:var(--serif)', text: alt.quando }),
              el('div.mini.fraco', { text: alt.saida })
            ]);
          })),
          el('div.linha-btn', {}, [
            el('button.btn.btn--p', { type: 'button', text: '+ Nova saída',
              onclick: function () { formAlternativa(store, null); } })
          ])
        ]),

        bloco('Aparência', 'Vale para este aparelho.', ['auto', 'claro', 'escuro'].map(function (t) {
          var rotulos = { auto: 'Automático', claro: 'Claro', escuro: 'Escuro' };
          return el('button.btn.btn--p' + (a.tema === t ? '.btn--principal' : '.btn--fantasma'), {
            type: 'button', text: rotulos[t],
            onclick: function () {
              store.commit(function (s) { s.ajustes.tema = t; });
              App.aplicarTema();
              App.render();
            }
          });
        })),

        el('div.cartao.pilha.pilha--junta', {}, [
          el('div.item__titulo', { text: 'Áreas que quero ver' }),
          el('p.mini.sub', { text: 'Desligue o que não faz sentido para você — o app não precisa ter tudo.' }),
          el('div.linha-btn', {}, SECOES.map(function (s) {
            var ativo = a.secoes[s.chave] !== false;
            return el('button.opcao', {
              type: 'button', text: s.nome, 'aria-pressed': ativo ? 'true' : 'false',
              onclick: function () {
                store.commit(function (st) { st.ajustes.secoes[s.chave] = !ativo; });
                App.render();
              }
            });
          }))
        ]),

        bloco('Backup', 'Tudo fica só neste aparelho. Guarde uma cópia de vez em quando.', [
          el('button.btn.btn--p', { type: 'button', text: '⤓ Baixar backup', onclick: function () { baixarBackup(store); } }),
          el('button.btn.btn--p', { type: 'button', text: '⤒ Restaurar backup', onclick: function () { restaurarBackup(store); } })
        ]),

        bloco('Rotina "' + store.nomeDoQuadro() + '"',
          'Carrega o quadro inteiro: horários da semana, rituais, prioridades, lema e as saídas para os dias pesados.', [
          el('button.btn.btn--p', {
            type: 'button', text: 'Carregar a rotina do quadro',
            onclick: function () {
              if (!confirm('Isso substitui a rotina atual pelo quadro "' + store.nomeDoQuadro() + '". Continuar?')) return;
              store.semear();
              ui.aviso('Rotina carregada');
              App.render();
            }
          })
        ]),

        bloco('Recomeçar', 'Você escolhe se mantém a estrutura (rotina, rituais, matérias) ou apaga tudo.', [
          el('button.btn.btn--p.btn--perigo', {
            type: 'button', text: 'Limpar histórico',
            onclick: function () {
              if (!confirm('Apagar marcações, tarefas, sessões e revisões, mantendo a estrutura?')) return;
              store.limpar(true);
              ui.aviso('Histórico limpo');
              App.render();
            }
          }),
          el('button.btn.btn--p.btn--perigo', {
            type: 'button', text: 'Apagar tudo',

              App.render();

        el('div.cartao.pilha.pilha--junta', {}, [
          el('div.item__titulo', { text: 'Sobre' }),

            'No celular, use “Adicionar à tela de início” para abrir como aplicativo.' }),

          el('p.mini.fraco', { style: 'font-style:italic',

      ]);
    }
  };
})();

  /* Faz o app se anunciar como aplicativo: em tela cheia, com nome e ícone. */
  function anunciarComoApp() {
    function marca(seletor, criar) {
      if (document.head.querySelector(seletor)) return;
      document.head.appendChild(criar());
    }
    function meta(nome, conteudo) {
      return function () {
        var m = document.createElement('meta');
        m.setAttribute('name', nome);
        m.setAttribute('content', conteudo);
        return m;
      };
    }

    marca('meta[name="apple-mobile-web-app-capable"]', meta('apple-mobile-web-app-capable', 'yes'));
    marca('meta[name="mobile-web-app-capable"]', meta('mobile-web-app-capable', 'yes'));
    marca('meta[name="apple-mobile-web-app-status-bar-style"]', meta('apple-mobile-web-app-status-bar-style', 'default'));
    marca('meta[name="apple-mobile-web-app-title"]', meta('apple-mobile-web-app-title', 'Minha Rotina'));
    marca('meta[name="theme-color"]', meta('theme-color', '#FAF7F0'));
    marca('link[rel="apple-touch-icon"]', function () {
      var l = document.createElement('link');
      l.setAttribute('rel', 'apple-touch-icon');
      l.setAttribute('href', ICONE_180);
      return l;
    });
  }

  function temaEscuro() {
    var t = store.estado.ajustes.tema || 'auto';
    if (t === 'escuro') return true;
    if (t === 'claro') return false;
    return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  /* O acento da interface é a cor litúrgica do dia. */
  function aplicarTema() {
    var raiz = document.documentElement;
    raiz.setAttribute('data-theme', store.estado.ajustes.tema || 'auto');

    var p = App.motor.paletaLiturgica(App.util.hoje(), temaEscuro());
    raiz.style.setProperty('--sazonal', p.cores[0]);
    raiz.style.setProperty('--sazonal-suave', p.cores[1]);
    raiz.style.setProperty('--sazonal-forte', p.cores[2]);
    raiz.setAttribute('data-tempo', p.tempo);

    var selo = document.getElementById('tempoLiturgico');
    if (selo) selo.textContent = p.tempo;
  }

  function render() {
    var rota = lerRota();
    var view = App.views[rota.nome];

    if (rotaAnterior && rotaAnterior !== rota.nome) {
      var anterior = App.views[rotaAnterior];
      if (anterior && anterior.aoSair) anterior.aoSair();
    }
    if (rotaAnterior !== rota.nome && view.aoEntrar) view.aoEntrar(rota.params, store);
    rotaAnterior = rota.nome;

    tituloEl.textContent = view.titulo;
    document.title = view.titulo + ' · Minha Rotina';

    telaEl.innerHTML = '';
    telaEl.appendChild(view.render(store));

    Array.prototype.forEach.call(abasEl.querySelectorAll('.aba'), function (a) {
      var ativo = a.dataset.rota === rota.nome
        || (a.dataset.rota === 'mais' && ABAS.indexOf(rota.nome) === -1);
      a.classList.toggle('ativa', ativo);
      if (ativo) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });

  }

  function iniciar() {
    telaEl = document.getElementById('tela');
    tituloEl = document.getElementById('tituloTela');
    abasEl = document.getElementById('abas');

    store.iniciar();
    App.ui.iniciar();
    anunciarComoApp();
    aplicarTema();

    document.getElementById('btnTema').addEventListener('click', function () {
      var ordem = ['auto', 'claro', 'escuro'];
      var proximo = ordem[(ordem.indexOf(store.estado.ajustes.tema || 'auto') + 1) % 3];
      store.commit(function (s) { s.ajustes.tema = proximo; });
      aplicarTema();
      App.ui.aviso('Tema: ' + proximo);
    });

    if (window.matchMedia) {
      var escura = window.matchMedia('(prefers-color-scheme: dark)');
      var aoTrocar = function () { aplicarTema(); };
      if (escura.addEventListener) escura.addEventListener('change', aoTrocar);
      else if (escura.addListener) escura.addListener(aoTrocar);
    }

    window.addEventListener('hashchange', function () {
      render();
      window.scrollTo(0, 0);
    });

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) render();
    });

    if (!location.hash) location.replace('#/hoje');
    render();

  }

  App.render = render;
  App.aplicarTema = aplicarTema;

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
  else iniciar();
})();

</script>
