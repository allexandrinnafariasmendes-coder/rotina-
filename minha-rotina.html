/* ---------------------------------------------------------------
   Minha Rotina — direção "Missal".

   Referência: a página de um missal impresso. Papel marfim, tinta preta,
   rubrica vermelha (é daí que vem a palavra "rubrica"), filete dourado e
   tipografia de livro. Nada de sombras, brilhos ou cantos inflados.

   O acento da interface segue o tempo litúrgico: verde no Tempo Comum,
   violeta no Advento e na Quaresma, ouro no Natal e na Páscoa, rubro em
   Pentecostes. As variáveis --sazonal* são escritas por js/app.js.
----------------------------------------------------------------*/

:root {
  --papel: #FBF8F3;
  --superficie: #FFFDFA;
  --superficie-2: #F6EFE6;
  --filete: #E9DFD1;          /* linha fina que separa tudo */
  --filete-forte: #D3C6B1;
  --tinta: #322A22;
  --marrom: #6E5A48;          /* serifada de exibição, como num frontispício */
  --suave: #6E665B;
  --fraco: #A2998A;
  --blush: #EBD7D3;
  --blush-claro: #FAF1ED;

  --rubrica: #8C2F39;         /* vermelho de missal: ênfase, atraso, prioridade */
  --rubrica-clara: #F6EDEA;
  --ouro: #A8874A;            /* só em filetes e ornamentos */
  --ouro-claro: #F7F1E1;

  --sazonal: #4C6650;         /* sobrescrito pelo tempo litúrgico */
  --sazonal-suave: #EDF1EA;
  --sazonal-forte: #3C5240;

  --primaria: var(--sazonal);
  --primaria-texto: #FFFDF8;

  --raio: 3px;
  --raio-p: 2px;
  --serif: 'Hoefler Text', 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --seguro-b: env(safe-area-inset-bottom, 0px);
}

html[data-theme="escuro"] {
  --papel: #161512;
  --superficie: #1D1B17;
  --superficie-2: #24211B;
  --filete: #322E26;
  --filete-forte: #45402F;
  --tinta: #F2ECE0;
  --marrom: #DCC6AC;
  --suave: #B4AC9D;
  --fraco: #857D6F;
  --blush: #4A3833;
  --blush-claro: #2B2220;

  --rubrica: #C4737B;
  --rubrica-clara: #2C1F20;
  --ouro: #C3A461;
  --ouro-claro: #2A2418;

  --sazonal: #8FA98A;
  --sazonal-suave: #22271F;
  --sazonal-forte: #A6BCA0;

  --primaria-texto: #161512;
}

@media (prefers-color-scheme: dark) {
  html[data-theme="auto"] {
    --papel: #161512;
    --superficie: #1D1B17;
    --superficie-2: #24211B;
    --filete: #322E26;
    --filete-forte: #45402F;
    --tinta: #F2ECE0;
    --marrom: #DCC6AC;
    --suave: #B4AC9D;
    --fraco: #857D6F;
    --blush: #4A3833;
    --blush-claro: #2B2220;
    --rubrica: #C4737B;
    --rubrica-clara: #2C1F20;
    --ouro: #C3A461;
    --ouro-claro: #2A2418;
    --sazonal: #8FA98A;
    --sazonal-suave: #22271F;
    --sazonal-forte: #A6BCA0;
    --primaria-texto: #161512;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--papel);
  color: var(--tinta);
  font: 15px/1.6 var(--sans);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; }

/* Rótulo em versalete: o recurso tipográfico que dá o tom do app. */
.versalete, .titulo-secao h2, .periodo__titulo span:first-child, .aba span,
.numero__rotulo, .btn, .atalho, .etiqueta, .menu-item__nome {
  text-transform: uppercase;
  letter-spacing: .14em;
  font-size: 10.5px;
  font-weight: 600;
}

/* ------------------------------------------------ estrutura -- */

.app { max-width: 600px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

.topo {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 18px 22px 12px;
  background: color-mix(in srgb, var(--papel) 92%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--filete);
}
.topo__titulo {
  font-family: var(--serif); font-size: 19px; font-weight: 400;
  letter-spacing: .02em; color: var(--marrom);
}
.topo__acoes { display: flex; align-items: center; gap: 10px; }
.topo__tempo { color: var(--sazonal-forte); white-space: nowrap; }
@media (max-width: 360px) { .topo__tempo { display: none; } }

.btn-icone {
  border: 1px solid var(--filete); background: transparent; color: var(--suave);
  width: 32px; height: 32px; border-radius: 2px; cursor: pointer;
  display: grid; place-items: center; transition: border-color .18s ease, color .18s ease;
}
.btn-icone:hover { border-color: var(--filete-forte); color: var(--tinta); }
.btn-icone svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }

.tela { flex: 1; padding: 4px 22px calc(92px + var(--seguro-b)); animation: entrar .3s ease both; }

/* Barra inferior sóbria, encostada na base, separada por um filete. */
.barra-abas {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(6, 1fr);
  padding: 8px 6px calc(8px + var(--seguro-b));
  background: color-mix(in srgb, var(--papel) 96%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--filete);
}
.aba {
  display: grid; justify-items: center; gap: 5px;
  padding: 4px 2px; color: var(--fraco);
  transition: color .18s ease;
}
.aba svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.aba span { font-size: 8.5px; letter-spacing: .1em; }
.aba.ativa { color: var(--sazonal-forte); }
.aba.ativa svg { stroke-width: 1.5; }

.fab { display: none; }

/* -------------------------------------------------- blocos --- */

.pilha { display: grid; gap: 10px; }
.pilha--junta { gap: 6px; }

.cartao {
  background: var(--superficie); border: 1px solid var(--filete);
  border-radius: var(--raio); padding: 16px 17px;
}
.cartao--destaque { background: var(--blush-claro); border-color: var(--blush); }

/* Título de seção: versalete com um filete que atravessa o resto da linha. */
.titulo-secao {
  display: flex; align-items: center; gap: 12px;
  margin: 30px 0 12px;
}
.titulo-secao h2 { color: var(--suave); white-space: nowrap; font-family: var(--sans); }
.titulo-secao::after {
  content: ''; flex: 1; height: 1px; background: var(--filete);
}
.titulo-secao span, .titulo-secao button {
  order: 3; font-size: 11px; color: var(--fraco); white-space: nowrap;
}

.sub { color: var(--suave); }
.mini { font-size: 12.5px; }
.fraco { color: var(--fraco); }

.vazio {
  text-align: center; padding: 28px 18px;
  border: 1px solid var(--filete); border-radius: var(--raio);
  color: var(--fraco); background: transparent;
}
.vazio strong {
  display: block; color: var(--marrom); margin-bottom: 5px;
  font-family: var(--serif); font-size: 16px; font-weight: 400;
}

/* Ornamento discreto entre blocos maiores. */
.ornamento { display: flex; align-items: center; justify-content: center; margin: 26px 0 4px; color: var(--ouro); }
.ornamento svg { width: 96px; height: 12px; }

/* -------------------------------------------------- botões --- */

.btn {
  border: 1px solid var(--filete-forte); background: transparent; color: var(--tinta);
  border-radius: var(--raio-p); padding: 10px 16px; cursor: pointer;
  transition: background .18s ease, border-color .18s ease;
}
.btn:hover { border-color: var(--tinta); }
.btn--principal { background: var(--sazonal); border-color: var(--sazonal); color: var(--primaria-texto); }
.btn--principal:hover { background: var(--sazonal-forte); border-color: var(--sazonal-forte); }
.btn--suave { background: var(--superficie-2); border-color: var(--filete); }
.btn--fantasma { border-color: transparent; color: var(--suave); }
.btn--fantasma:hover { border-color: var(--filete); }
.btn--perigo { color: var(--rubrica); border-color: color-mix(in srgb, var(--rubrica) 35%, var(--filete)); }
.btn--largo { width: 100%; }
.btn--p { padding: 7px 12px; font-size: 9.5px; }

.linha-btn { display: flex; gap: 8px; flex-wrap: wrap; }
.linha-btn--fim { justify-content: flex-end; }

.link {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--sazonal-forte); font-size: 12.5px;
  border-bottom: 1px solid color-mix(in srgb, var(--sazonal) 45%, transparent);
}

/* ---------------------------------------------- cabeçalho ---- */

.hoje-topo { padding: 14px 0 2px; }
.hoje-topo__data {
  font-family: var(--serif); font-size: 30px; font-weight: 400; color: var(--marrom);
  letter-spacing: -.008em; line-height: 1.16;
}
.hoje-topo__frase {
  color: var(--suave); font-family: var(--serif); font-style: italic; font-size: 16.5px;
  margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--ouro);
  max-width: 34ch;
}
.hoje-topo__linha { display: flex; align-items: center; gap: 12px; margin-top: 18px; }

.progresso { flex: 1; height: 2px; background: var(--filete); }
.progresso__barra { height: 100%; background: var(--sazonal); transition: width .6s ease; }

/* ---------------------------------------------- linha do dia - */

.periodo { margin-top: 26px; }
.periodo__titulo {
  display: flex; align-items: center; gap: 10px;
  color: var(--suave); margin: 0 0 10px;
}
.periodo__titulo::after { content: ''; flex: 1; height: 1px; background: var(--filete); }
.periodo__titulo em {
  order: 3; font-style: normal; font-size: 11px; color: var(--fraco);
  font-variant-numeric: tabular-nums;
}

.item {
  display: flex; align-items: flex-start; gap: 14px;
  background: var(--superficie); border: 1px solid var(--filete);
  border-radius: var(--raio); padding: 13px 15px;
  transition: opacity .25s ease, border-color .18s ease;
}
.item + .item { margin-top: 6px; }
.item--feito { opacity: .5; background: transparent; }
.item--feito .item__titulo { text-decoration: line-through; text-decoration-thickness: 1px; }
.item--agora { border-color: var(--sazonal); border-left: 3px solid var(--sazonal); }
.item--clicavel { cursor: pointer; }
.item--clicavel:hover { border-color: var(--filete-forte); }

.item__hora {
  flex: none; min-width: 44px; padding-top: 2px;
  font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--suave);
  letter-spacing: .02em;
}
.item__corpo { flex: 1; min-width: 0; }
.item__titulo { font-family: var(--serif); font-size: 16px; line-height: 1.3; }
.item__meta {
  font-size: 11px; color: var(--fraco); display: flex; gap: 9px; flex-wrap: wrap;
  margin-top: 4px; align-items: center;
}
.item__nota { font-size: 12.5px; color: var(--suave); margin-top: 5px; font-family: var(--serif); font-style: italic; }

.check {
  flex: none; width: 20px; height: 20px; margin-top: 3px;
  border-radius: 50%; border: 1px solid var(--filete-forte); background: transparent;
  cursor: pointer; display: grid; place-items: center; color: transparent; font-size: 10px;
  transition: background .2s ease, border-color .2s ease;
}
.check:hover { border-color: var(--sazonal); }
.check[aria-pressed="true"] { background: var(--sazonal); border-color: var(--sazonal); color: var(--primaria-texto); }

.ponto { width: 5px; height: 5px; border-radius: 50%; flex: none; display: inline-block; }

.etiqueta {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 7px; border: 1px solid var(--filete); border-radius: var(--raio-p);
  color: var(--suave); font-size: 9px;
}
.etiqueta--rosa { border-color: color-mix(in srgb, var(--rubrica) 40%, transparent); color: var(--rubrica); }
.etiqueta--salvia { border-color: color-mix(in srgb, var(--sazonal) 55%, transparent); color: var(--sazonal-forte); }
.etiqueta--azul { border-color: var(--filete-forte); color: var(--suave); }
.etiqueta--dourada { border-color: color-mix(in srgb, var(--ouro) 55%, transparent); color: var(--ouro); }

/* ---------------------------------------------- avisos ------- */

.aviso { border: 1px solid var(--filete); border-left: 3px solid var(--ouro); border-radius: var(--raio); padding: 15px 17px; }
.aviso--cuidado { border-left-color: var(--sazonal); }
.aviso--atencao { border-left-color: var(--rubrica); }
.aviso__titulo { font-family: var(--serif); font-size: 16.5px; margin-bottom: 4px; color: var(--marrom); }
.aviso__texto { font-size: 13.5px; color: var(--suave); }
.aviso .btn { margin-top: 12px; }

/* ---------------------------------------------- menu --------- */

.grade-menu { display: grid; gap: 0; margin-top: 10px; border-top: 1px solid var(--filete); }
.menu-item {
  display: grid; grid-template-columns: 26px 1fr; column-gap: 14px; align-items: center;
  padding: 16px 2px; border-bottom: 1px solid var(--filete);
  transition: padding-left .2s ease;
}
.menu-item:hover { padding-left: 6px; }
.menu-item__icone { grid-row: 1 / 3; color: var(--sazonal-forte); }
.menu-item__icone svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
.menu-item__nome { color: var(--tinta); font-size: 11px; }
.menu-item__desc { font-size: 12.5px; color: var(--fraco); font-family: var(--serif); font-style: italic; }

/* ---------------------------------------------- listas ------- */

.lista-check { display: grid; margin-top: 12px; }
.check-linha {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 0; cursor: pointer; border-bottom: 1px solid var(--filete);
  font-family: var(--serif); font-size: 15px;
}
.check-linha:last-child { border-bottom: 0; }
.check-linha--feito { color: var(--fraco); text-decoration: line-through; text-decoration-thickness: 1px; }

.quadro { display: flex; gap: 4px; margin-top: 14px; }
.quadro__dia { flex: 1; display: grid; gap: 5px; justify-items: center; font-size: 9px; color: var(--fraco); letter-spacing: .1em; }
.quadro__cel { width: 100%; height: 20px; border: 1px solid var(--filete); background: transparent; cursor: pointer; padding: 0; }
.quadro__cel.feita { background: var(--sazonal); border-color: var(--sazonal); }
.quadro__cel.hoje { border-color: var(--ouro); }

/* ---------------------------------------------- agenda ------- */

.semana-fita { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0; margin: 6px 0 4px;
  border: 1px solid var(--filete); border-radius: var(--raio); overflow: hidden; }
.dia-fita { padding: 10px 2px 8px; text-align: center; cursor: pointer; background: transparent;
  border-right: 1px solid var(--filete); transition: background .18s ease; }
.dia-fita:last-child { border-right: 0; }
.dia-fita__nome { font-size: 8.5px; color: var(--fraco); letter-spacing: .12em; text-transform: uppercase; }
.dia-fita__num { font-family: var(--serif); font-size: 18px; margin-top: 2px; font-variant-numeric: lining-nums; }
.dia-fita__pontos { display: flex; gap: 2px; justify-content: center; margin-top: 5px; height: 3px; }
.dia-fita__ponto { width: 3px; height: 3px; border-radius: 50%; }
.dia-fita.ativo { background: var(--tinta); color: var(--papel); }
.dia-fita.ativo .dia-fita__nome { color: color-mix(in srgb, var(--papel) 65%, transparent); }

/* ---------------------------------------------- estudos ------ */

.arvore__disciplina { display: flex; align-items: center; gap: 12px; }
.monograma {
  width: 34px; height: 34px; flex: none; border: 1px solid var(--ouro); border-radius: 50%;
  display: grid; place-items: center; font-family: var(--serif); font-size: 16px; color: var(--ouro);
}
.arvore__assunto {
  font-size: 9.5px; color: var(--fraco); margin: 16px 0 6px 46px;
  text-transform: uppercase; letter-spacing: .16em;
}
.arvore__topico {
  display: flex; align-items: center; gap: 10px;
  margin-left: 46px; padding: 9px 0; border-bottom: 1px solid var(--filete);
  cursor: pointer; font-family: var(--serif); font-size: 15px;
}
.arvore__status { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.st-nao { background: var(--filete-forte); }
.st-estudando { background: var(--ouro); }
.st-ok { background: var(--sazonal); }

.cronometro {
  border: 1px solid var(--filete-forte); border-radius: var(--raio); padding: 26px 16px;
  display: grid; justify-items: center; gap: 12px; background: var(--superficie);
}
.cronometro__tempo { font-family: var(--serif); font-size: 46px; color: var(--marrom); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.cronometro__nome { font-size: 10px; text-transform: uppercase; letter-spacing: .16em; color: var(--fraco); }

/* ---------------------------------------------- semana ------- */

.numeros { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1px; background: var(--filete);
  border: 1px solid var(--filete); border-radius: var(--raio); }
.numero { background: var(--superficie); padding: 16px 14px; }
.numero__valor { font-family: var(--serif); font-size: 24px; font-variant-numeric: lining-nums; color: var(--marrom); }
.numero__rotulo { color: var(--fraco); margin-top: 4px; font-size: 9px; }

.colunas { display: flex; align-items: flex-end; gap: 8px; height: 108px; }
.coluna { flex: 1; display: grid; align-content: end; justify-items: center; gap: 7px; height: 100%; }
.coluna__barra { width: 100%; min-height: 2px; background: var(--sazonal); }
.coluna__barra--vazia { background: var(--filete); }
.coluna__dia { font-size: 9px; color: var(--fraco); letter-spacing: .1em; }

/* ---------------------------------------------- assistente --- */

.conversa { display: grid; gap: 12px; margin-top: 6px; }
.balao { padding: 14px 16px; border-radius: var(--raio); max-width: 90%; font-size: 14.5px; line-height: 1.55;
  animation: entrar .26s ease both; }
.balao--eu { background: var(--superficie-2); border: 1px solid var(--filete); justify-self: end; font-family: var(--serif); }
.balao--app { background: transparent; border: 1px solid var(--filete); border-left: 3px solid var(--ouro); justify-self: start; }

.sugestao {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center;
  padding: 14px 0; border-bottom: 1px solid var(--filete);
}
.sugestao__porque { grid-column: 1 / -1; font-size: 12.5px; color: var(--suave); font-family: var(--serif); font-style: italic; }

.plano-linha { display: flex; gap: 14px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--filete); }
.plano-linha--existente { color: var(--fraco); }
.plano-linha--novo { border-left: 2px solid var(--sazonal); padding-left: 10px; }

.dias__pilula {

@keyframes subir { from { transform: translateY(14px); opacity: .5; } to { transform: none; opacity: 1; } }

/* Funções auxiliares: datas, horários, formatação e criação de elementos. */
(function () {
  'use strict';

  var App = window.App || (window.App = {});

  var DIAS_CURTOS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var DIAS_MINI = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
  var DIAS_LONGOS = ['domingo', 'segunda-feira', 'terça-feira', 'quarta-feira', 'quinta-feira', 'sexta-feira', 'sábado'];
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
               'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function maiuscula(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /* Datas sempre no fuso local, no formato AAAA-MM-DD. */
  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  function fromISO(iso) {
    var p = String(iso).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  function hoje() { return toISO(new Date()); }
  function agoraMin() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }

  function somarDias(iso, n) {
    var d = fromISO(iso);
    d.setDate(d.getDate() + n);
    return toISO(d);
  }

  function diasEntre(a, b) {
    return Math.round((fromISO(b) - fromISO(a)) / 86400000);
  }

  function diaDaSemana(iso) { return fromISO(iso).getDay(); }

  function dataLonga(iso) {
    var d = fromISO(iso);
    return maiuscula(DIAS_LONGOS[d.getDay()]) + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()];
  }

  function dataCurta(iso) {
    var d = fromISO(iso);
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
  }

  function dataRelativa(iso) {
    if (!iso) return 'algum dia';
    var h = hoje();
    if (iso === h) return 'hoje';
    if (iso === somarDias(h, 1)) return 'amanhã';
    if (iso === somarDias(h, -1)) return 'ontem';
    var d = diasEntre(h, iso);
    if (d > 1 && d < 7) return DIAS_CURTOS[diaDaSemana(iso)].toLowerCase() + ' (' + dataCurta(iso) + ')';
    return dataCurta(iso);
  }

  function ultimosDias(n, ate) {
    var fim = ate || hoje(), out = [];
    for (var i = n - 1; i >= 0; i--) out.push(somarDias(fim, -i));
    return out;
  }

  /* Semana de segunda a domingo contendo a data. */
  function inicioDaSemana(iso) {
    var dow = diaDaSemana(iso);
    return somarDias(iso, dow === 0 ? -6 : 1 - dow);
  }

  function diasDaSemana(iso) {
    var ini = inicioDaSemana(iso), out = [];
    for (var i = 0; i < 7; i++) out.push(somarDias(ini, i));
    return out;
  }

  /* -------------------------------------------------- horários */

  function minutosDe(hhmm) {
    if (!hhmm) return null;
    var p = String(hhmm).split(':');
    var h = Number(p[0]), m = Number(p[1] || 0);
    if (isNaN(h)) return null;
    return h * 60 + m;
  }

  function hhmm(min) {
    var m = ((Math.round(min) % 1440) + 1440) % 1440;
    return pad(Math.floor(m / 60)) + ':' + pad(m % 60);
  }

  function faixa(hora, duracao) {
    var ini = minutosDe(hora);
    if (ini === null) return '';
    if (!duracao) return hora;
    return hora + '–' + hhmm(ini + duracao);
  }

  function duracaoTexto(min) {
    if (!min) return '';
    if (min < 60) return min + ' min';
    var h = Math.floor(min / 60), m = min % 60;
    return m ? h + 'h' + pad(m) : h + 'h';
  }

  function horasTexto(min) {
    if (!min) return '0h';
    var h = Math.floor(min / 60), m = Math.round(min % 60);
    return m ? h + 'h' + pad(m) : h + 'h';
  }

  function periodoDe(hora) {
    var m = minutosDe(hora);
    if (m === null) return 'flex';
    if (m < 12 * 60) return 'manha';
    if (m < 18 * 60) return 'tarde';
    return 'noite';
  }

  function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function pct(feito, total) { return total ? Math.round((feito / total) * 100) : 0; }

  function plural(n, um, muitos) { return n + ' ' + (n === 1 ? um : muitos); }

  /* Texto sem acento e em minúsculas, para comparações do assistente. */
  function simples(t) {
    return String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  /* Criação de elementos: el('div.card', {onclick: fn}, [filhos]) */
  function el(spec, attrs, filhos) {
    var partes = String(spec).split('.');
    var node = document.createElement(partes.shift() || 'div');
    if (partes.length) node.className = partes.join(' ');

    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k.indexOf('on') === 0 && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (k === 'text') node.textContent = v;
      else if (k === 'dataset') Object.keys(v).forEach(function (d) { node.dataset[d] = v[d]; });
      else node.setAttribute(k, v === true ? '' : v);
    });

    [].concat(filhos === undefined ? [] : filhos).forEach(function (f) {
      if (f === null || f === undefined || f === false) return;
      node.appendChild(typeof f === 'string' || typeof f === 'number'
        ? document.createTextNode(String(f)) : f);
    });

    return node;
  }

  App.util = {
    DIAS_CURTOS: DIAS_CURTOS, DIAS_MINI: DIAS_MINI, DIAS_LONGOS: DIAS_LONGOS, MESES: MESES,
    pad: pad, maiuscula: maiuscula, toISO: toISO, fromISO: fromISO, hoje: hoje, agoraMin: agoraMin,
    somarDias: somarDias, diasEntre: diasEntre, diaDaSemana: diaDaSemana,
    dataLonga: dataLonga, dataCurta: dataCurta, dataRelativa: dataRelativa,
    ultimosDias: ultimosDias, inicioDaSemana: inicioDaSemana, diasDaSemana: diasDaSemana,
    minutosDe: minutosDe, hhmm: hhmm, faixa: faixa, duracaoTexto: duracaoTexto, horasTexto: horasTexto,
    periodoDe: periodoDe, id: id, pct: pct, plural: plural, simples: simples, el: el
  };
})();

</script>

      (d.ajustes && d.ajustes.secoes) || {});
    base.ajustes.lema = base.ajustes.lema || '';
    /* Quem já tinha o quadro carregado antes deste controle existir está em dia:
       o aviso só aparece para mudanças daqui em diante. */
    base.ajustes.rotinaVersao = d.ajustes && d.ajustes.rotinaVersao !== undefined
      ? Number(d.ajustes.rotinaVersao)
      : (base.ajustes.semeado ? quadro().versao : 0);
    base.ajustes.rotinaAdiada = Number((d.ajustes || {}).rotinaAdiada) || 0;
    base.ajustes.quadroId = (d.ajustes || {}).quadroId || (base.ajustes.semeado ? quadro().id : '');
    base.ajustes.prioridades = (base.ajustes.prioridades || []).map(String);

    base.alternativas = (d.alternativas || []).map(function (a) {
      return { id: a.id || u.id(), quando: String(a.quando || ''), saida: String(a.saida || '') };
    });
    base.registro = d.registro && typeof d.registro === 'object' ? d.registro : {};
    base.semanas = d.semanas && typeof d.semanas === 'object' ? d.semanas : {};
    base.sessaoAtiva = d.sessaoAtiva || null;

    base.blocos = (d.blocos || []).map(function (b) {
      return {
        id: b.id || u.id(),
        chave: b.chave || null,
        titulo: String(b.titulo || 'Sem título'),
        hora: b.hora || '',
        duracao: Number(b.duracao) || 0,
        dias: Array.isArray(b.dias) && b.dias.length ? b.dias.map(Number) : [0, 1, 2, 3, 4, 5, 6],
        area: AREAS[b.area] ? b.area : 'pessoal',
        fixo: !!b.fixo,
        nota: b.nota || ''
      };
    });

    base.eventos = (d.eventos || []).map(function (e) {
      return {
        id: e.id || u.id(),
        titulo: String(e.titulo || 'Sem título'),
        data: e.data || u.hoje(),
        hora: e.hora || '',
        duracao: Number(e.duracao) || 0,
        area: AREAS[e.area] ? e.area : 'compromisso',
        local: e.local || '',
        nota: e.nota || ''
      };
    });

    base.tarefas = (d.tarefas || []).map(function (t) {
      return {
        id: t.id || u.id(),
        titulo: String(t.titulo || 'Sem título'),
        data: t.data || null,
        feita: !!t.feita,
        prioridade: Math.min(3, Math.max(1, Number(t.prioridade) || (t.prioridade === true ? 3 : 2))),
        estimativa: Number(t.estimativa) || 30,
        area: AREAS[t.area] ? t.area : 'pessoal',
        objetivoId: t.objetivoId || null,
        criadaEm: t.criadaEm || u.hoje()
      };
    });

    base.objetivos = (d.objetivos || []).map(function (o) {
      return {
        id: o.id || u.id(),
        titulo: String(o.titulo || 'Sem título'),
        area: AREAS_OBJETIVO[o.area] ? o.area : 'vida',
        prazo: o.prazo || null,
        nota: o.nota || '',
        passos: (o.passos || []).map(function (p) {
          return { id: p.id || u.id(), titulo: String(p.titulo || ''), feito: !!p.feito };
        }),
        arquivado: !!o.arquivado
      };
    });

    base.disciplinas = (d.disciplinas || []).map(function (x) {
      return {
        id: x.id || u.id(),
        nome: String(x.nome || 'Disciplina'),
        emoji: x.emoji || '',
        topicos: (x.topicos || []).map(function (t) {
          return {
            id: t.id || u.id(),
            nome: String(t.nome || 'Conteúdo'),
            assunto: t.assunto || '',
            status: ['nao', 'estudando', 'ok'].indexOf(t.status) !== -1 ? t.status : 'nao',
            ultimaRevisao: t.ultimaRevisao || null,
            minutos: Number(t.minutos) || 0
          };
        })
      };
    });

    base.sessoes = (d.sessoes || []).map(function (s) {
      return {
        id: s.id || u.id(),
        data: s.data || u.hoje(),
        disciplinaId: s.disciplinaId || null,
        topicoId: s.topicoId || null,

      };

    base.rituais = (d.rituais || []).map(function (r) {
      return {

        periodo: ['manha', 'tarde', 'noite', 'qualquer'].indexOf(r.periodo) !== -1 ? r.periodo : 'qualquer',
        hora: r.hora || '',
        dias: Array.isArray(r.dias) && r.dias.length ? r.dias.map(Number) : [0, 1, 2, 3, 4, 5, 6],
        itens: (r.itens || []).map(function (i) {
          return { id: i.id || u.id(), titulo: String(i.titulo || '') };
        })
      };
    });

    base.cuidados = (d.cuidados || []).map(function (c) {
      return {

        titulo: String(c.titulo || 'Cuidado'),

      };
    });

    var esp = d.espiritual || {};
    base.espiritual = {
      praticas: (esp.praticas || []).map(function (p) {
        return { id: p.id || u.id(), titulo: String(p.titulo || ''), momento: p.momento || 'qualquer' };
      }),
      intencoes: (esp.intencoes || []).map(function (i) {
        return { id: i.id || u.id(), texto: String(i.texto || ''), criadaEm: i.criadaEm || u.hoje(), atendida: !!i.atendida };
      }),
      diario: (esp.diario || []).map(function (e) {
        return { id: e.id || u.id(), data: e.data || u.hoje(), texto: String(e.texto || '') };
      })
    };

    return base;
  }

  /* Converte os dados da primeira versão do app, se existirem. */
  function migrarV1(antigo) {
    var mapaArea = { saude: 'autocuidado', trabalho: 'estudo', estudo: 'estudo', casa: 'casa', lazer: 'hobby', pessoal: 'pessoal' };
    var novo = estadoInicial();
    novo.ajustes.nome = (antigo.ajustes && antigo.ajustes.nome) || '';
    novo.ajustes.tema = { dark: 'escuro', light: 'claro' }[(antigo.ajustes || {}).tema] || 'auto';
    novo.ajustes.semeado = true;

    novo.blocos = (antigo.blocos || []).map(function (b) {
      return {
        id: b.id, titulo: b.titulo, hora: b.hora, duracao: b.duracao, dias: b.dias,
        area: mapaArea[b.categoria] || 'pessoal', fixo: false, nota: b.nota || ''
      };
    });

    /* Cada hábito antigo vira um item de um ritual único. */
    if ((antigo.habitos || []).length) {
      var ritual = { id: u.id(), titulo: 'Meus hábitos', periodo: 'qualquer', hora: '', dias: [0, 1, 2, 3, 4, 5, 6], itens: [] };
      var mapaItem = {};
      antigo.habitos.forEach(function (h) {
        var item = { id: u.id(), titulo: h.titulo };
        mapaItem[h.id] = item.id;
        ritual.itens.push(item);
      });
      novo.rituais = [ritual];
      Object.keys(antigo.registro || {}).forEach(function (dia) {
        var r = antigo.registro[dia] || {};
        novo.registro[dia] = { blocos: r.blocos || {}, eventos: {}, itens: {}, praticas: {}, cuidados: {} };
        Object.keys(r.habitos || {}).forEach(function (hid) {
          if (mapaItem[hid]) novo.registro[dia].itens[mapaItem[hid]] = true;
        });
      });
    } else {
      Object.keys(antigo.registro || {}).forEach(function (dia) {
        novo.registro[dia] = { blocos: (antigo.registro[dia] || {}).blocos || {}, eventos: {}, itens: {}, praticas: {}, cuidados: {} };
      });
    }

    novo.tarefas = (antigo.tarefas || []).map(function (t) {
      return {
        id: t.id, titulo: t.titulo, data: t.data, feita: !!t.feita,
        prioridade: t.prioridade ? 3 : 2, estimativa: 30, area: 'pessoal',
        objetivoId: null, criadaEm: t.criadaEm || u.hoje()
      };
    });

    return novo;
  }

  function carregar() {
    var bruto = null, antigo = null;
    try {
      bruto = localStorage.getItem(CHAVE);
      antigo = localStorage.getItem(CHAVE_ANTIGA);
    } catch (e) { /* armazenamento indisponível */ }

    if (bruto) {
      try { estado = normalizar(JSON.parse(bruto)); return; } catch (e) { /* segue adiante */ }
    }
    if (antigo) {
      try {
        estado = normalizar(migrarV1(JSON.parse(antigo)));
        salvar();
        return;
      } catch (e) { /* segue adiante */ }
    }
    estado = estadoInicial();
  }

  function salvar() {
    try {
      localStorage.setItem(CHAVE, JSON.stringify(estado));
      return true;
    } catch (e) {
      if (App.ui && App.ui.aviso) App.ui.aviso('Não consegui salvar neste navegador');
      return false;
    }
  }

  function notificar() { ouvintes.forEach(function (fn) { fn(estado); }); }

  function commit(fn) {
    fn(estado);
    salvar();
    notificar();
  }

  /* ------------------------------------------------- registro */

  function dia(iso) {
    if (!estado.registro[iso]) estado.registro[iso] = {};
    var d = estado.registro[iso];
    ['blocos', 'eventos', 'itens', 'praticas', 'cuidados'].forEach(function (k) {
      if (!d[k]) d[k] = {};
    });
    return d;
  }

  function feito(balde, itemId, iso) {
    var d = estado.registro[iso];
    return !!(d && d[balde] && d[balde][itemId]);
  }

  function alternar(balde, itemId, iso) {
    commit(function () {
      var d = dia(iso);
      if (d[balde][itemId]) delete d[balde][itemId];
      else d[balde][itemId] = true;
    });
  }

  function revisao(iso) { return (estado.registro[iso] || {}).revisao || null; }

  function salvarRevisao(iso, dados) {
    commit(function () { dia(iso).revisao = dados; });
  }

  /* ------------------------------------------------ auxiliares */

  function objetivo(id) {
    return estado.objetivos.filter(function (o) { return o.id === id; })[0] || null;
  }

  function disciplinaDoTopico(topicoId) {
    var achou = null;
    estado.disciplinas.forEach(function (d) {
      d.topicos.forEach(function (t) { if (t.id === topicoId) achou = d; });
    });
    return achou;
  }

  function topico(topicoId) {
    var achou = null;
    estado.disciplinas.forEach(function (d) {
      d.topicos.forEach(function (t) { if (t.id === topicoId) achou = t; });
    });
    return achou;
  }

  /* Próxima data prevista de um cuidado recorrente. */
  function proximaVez(cuidado) {
    if (!cuidado.ultimaVez) return u.hoje();
    return u.somarDias(cuidado.ultimaVez, cuidado.intervalo);
  }

  function cuidadosDeHoje(iso) {
    var ref = iso || u.hoje();
    return estado.cuidados.filter(function (c) { return proximaVez(c) <= ref; });
  }

  /* -------------------------------------------------- exportar */

  function exportar() { return JSON.stringify(estado, null, 2); }

  function importar(texto) {
    estado = normalizar(JSON.parse(texto));
    salvar();
    notificar();
  }

  function aplicarSeed(estadoAlvo, ex) {
    Object.keys(ex).forEach(function (k) {
      if (k === 'lema' || k === 'prioridades') estadoAlvo.ajustes[k] = ex[k];
      else estadoAlvo[k] = ex[k];
    });
    estadoAlvo.ajustes.acordar = '05:00';
    estadoAlvo.ajustes.dormir = '22:00';
    estadoAlvo.ajustes.semeado = true;
    estadoAlvo.ajustes.rotinaVersao = quadro().versao;
    estadoAlvo.ajustes.quadroId = quadro().id;
    estadoAlvo.ajustes.rotinaAdiada = 0;
  }

  function semear() {
    var ex = exemplo();
    commit(function (s) { aplicarSeed(s, ex); });
  }

  /* Há uma versão mais nova do quadro para aplicar? */
  function rotinaDesatualizada() {
    var a = estado.ajustes;
    if (!a.semeado) return null;
    /* Uma rotina vinda de outro quadro nunca é sobrescrita por este. */
    if (a.quadroId && a.quadroId !== quadro().id) return null;

    var atual = Number(a.rotinaVersao) || 0;
    if (atual >= quadro().versao) return null;
    if (Number(a.rotinaAdiada) >= quadro().versao) return null;

    var notas = [];
    for (var v = atual + 1; v <= quadro().versao; v++) {
      if (quadro().notas[v]) notas.push(quadro().notas[v]);
    }
    return { versao: quadro().versao, notas: notas };
  }

  function adiarAtualizacao() {
    commit(function (s) { s.ajustes.rotinaAdiada = quadro().versao; });
  }

  /* Aplica a versão nova do quadro casando cada item pela chave: os horários
     mudam, mas os ids continuam os mesmos — então marcações, tarefas, estudos
     e histórico ficam todos de pé. O que você criou por conta não é tocado. */
  function atualizarRotina() {
    var ex = exemplo();

    commit(function (s) {
      var blocoPorChave = {};
      s.blocos.forEach(function (b) { if (b.chave) blocoPorChave[b.chave] = b; });

      var chavesDoQuadro = {};
      ex.blocos.forEach(function (novo) {
        chavesDoQuadro[novo.chave] = true;
        var atual = blocoPorChave[novo.chave];
        if (!atual) { s.blocos.push(novo); return; }
        atual.titulo = novo.titulo;
        atual.hora = novo.hora;
        atual.duracao = novo.duracao;
        atual.dias = novo.dias;
        atual.area = novo.area;
        atual.fixo = novo.fixo;
        atual.nota = novo.nota;
      });
      /* sai só o que veio do quadro e não existe mais nele */
      s.blocos = s.blocos.filter(function (b) { return !b.chave || chavesDoQuadro[b.chave]; });

      var ritualPorChave = {};
      s.rituais.forEach(function (r) { if (r.chave) ritualPorChave[r.chave] = r; });

      var chavesRituais = {};
      ex.rituais.forEach(function (novo) {
        chavesRituais[novo.chave] = true;
        var atual = ritualPorChave[novo.chave];
        if (!atual) { s.rituais.push(novo); return; }
        atual.titulo = novo.titulo;
        atual.periodo = novo.periodo;
        atual.hora = novo.hora;
        atual.dias = novo.dias;
        /* os passos são casados pelo texto, para as marcações continuarem valendo */
        var porTitulo = {};
        atual.itens.forEach(function (i) { porTitulo[i.titulo] = i; });
        atual.itens = novo.itens.map(function (i) { return porTitulo[i.titulo] || i; });
      });
      s.rituais = s.rituais.filter(function (r) { return !r.chave || chavesRituais[r.chave]; });

      s.ajustes.rotinaVersao = quadro().versao;
      s.ajustes.quadroId = quadro().id;
      s.ajustes.rotinaAdiada = 0;
    });
  }

  function limpar(manterEstrutura) {
    var guardado = {
      blocos: estado.blocos, rituais: estado.rituais, cuidados: estado.cuidados,
      disciplinas: estado.disciplinas, objetivos: estado.objetivos,
      espiritual: estado.espiritual, alternativas: estado.alternativas
    };
    var ajustesAntigos = estado.ajustes;
    var nome = estado.ajustes.nome, tema = estado.ajustes.tema;
    estado = estadoInicial();
    estado.ajustes.nome = nome;
    estado.ajustes.tema = tema;
    estado.ajustes.lema = ajustesAntigos.lema;
    estado.ajustes.prioridades = ajustesAntigos.prioridades;
    estado.ajustes.acordar = ajustesAntigos.acordar;
    estado.ajustes.dormir = ajustesAntigos.dormir;
    estado.ajustes.semeado = true;
    if (manterEstrutura) Object.keys(guardado).forEach(function (k) { estado[k] = guardado[k]; });
    salvar();
    notificar();
  }

  App.store = {
    AREAS: AREAS,
    AREAS_DESCANSO: AREAS_DESCANSO,
    AREAS_OBJETIVO: AREAS_OBJETIVO,
    iniciar: function () {
      carregar();
      if (!estado.ajustes.semeado && !estado.blocos.length) {
        aplicarSeed(estado, exemplo());
        salvar();
      }
    },
    get estado() { return estado; },
    subscrever: function (fn) { ouvintes.push(fn); },
    commit: commit,
    dia: dia,
    feito: feito,
    alternar: alternar,
    revisao: revisao,
    salvarRevisao: salvarRevisao,
    objetivo: objetivo,
    topico: topico,
    disciplinaDoTopico: disciplinaDoTopico,
    proximaVez: proximaVez,
    cuidadosDeHoje: cuidadosDeHoje,
    exportar: exportar,
    importar: importar,
    semear: semear,
    nomeDoQuadro: nomeDoQuadro,
    exemploDeLema: exemploDeLema,
    rotinaDesatualizada: rotinaDesatualizada,
    atualizarRotina: atualizarRotina,
    adiarAtualizacao: adiarAtualizacao,
    limpar: limpar
  };
})();
