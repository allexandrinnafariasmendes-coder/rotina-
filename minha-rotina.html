  <script>
/* Motor da rotina: monta o dia, analisa excessos, sugere o que fazer agora
   e interpreta pedidos escritos em português. Tudo local, sem internet. */
(function () {
  'use strict';

  var App = window.App;
  var u = App.util;

  function store() { return App.store; }
  function e() { return App.store.estado; }

  /* ------------------------------------------------- o dia ---- */

  function acordar() { return u.minutosDe(e().ajustes.acordar || '06:30'); }
  function dormir() { return u.minutosDe(e().ajustes.dormir || '22:30'); }

  /* Um dia planejado pelo assistente pode substituir a rotina recorrente. */
  function somentePlano(iso) {
    var r = e().registro[iso];
    return !!(r && r.somentePlano);
  }

  /* Lista única do dia: rotina recorrente + compromissos + rituais. */
  function itensDoDia(iso) {
    var dow = u.diaDaSemana(iso);
    var out = [];

    if (!somentePlano(iso)) {
      e().blocos.forEach(function (b) {
        if (b.dias.indexOf(dow) === -1) return;
        out.push({
          tipo: 'bloco', ref: b, id: b.id, titulo: b.titulo, hora: b.hora,
          duracao: b.duracao, area: b.area, fixo: b.fixo, nota: b.nota,
          feito: store().feito('blocos', b.id, iso)
        });
      });
    }

    e().eventos.forEach(function (ev) {
      if (ev.data !== iso) return;
      out.push({
        tipo: 'evento', ref: ev, id: ev.id, titulo: ev.titulo, hora: ev.hora,
        duracao: ev.duracao, area: ev.area, fixo: true, nota: ev.local || ev.nota,
        feito: store().feito('eventos', ev.id, iso)
      });
    });

    e().rituais.forEach(function (r) {
      if (r.dias.indexOf(dow) === -1) return;
      var marcados = r.itens.filter(function (i) { return store().feito('itens', i.id, iso); }).length;
      out.push({
        tipo: 'ritual', ref: r, id: r.id, titulo: r.titulo, hora: r.hora,
        duracao: Math.max(10, r.itens.length * 5), area: 'pessoal', fixo: false,
        nota: marcados + '/' + r.itens.length,
        feito: r.itens.length > 0 && marcados === r.itens.length
      });
    });

    return out.sort(function (a, b) {
      var ma = u.minutosDe(a.hora), mb = u.minutosDe(b.hora);
      if (ma === null && mb === null) return 0;
      if (ma === null) return 1;
      if (mb === null) return -1;
      return ma - mb;
    });
  }

  function porPeriodo(iso) {
    var grupos = { manha: [], tarde: [], noite: [], flex: [] };
    itensDoDia(iso).forEach(function (i) { grupos[u.periodoDe(i.hora)].push(i); });
    return grupos;
  }

  /* O que está acontecendo agora e o que vem em seguida. */
  function agoraEDepois(iso) {
    if (iso !== u.hoje()) return { agora: null, proximo: null };
    var min = u.agoraMin();
    var agora = null, proximo = null;

    itensDoDia(iso).forEach(function (i) {
      var ini = u.minutosDe(i.hora);
      if (ini === null) return;
      var fim = ini + (i.duracao || 30);
      if (min >= ini && min < fim) agora = i;
      else if (ini > min && (!proximo || ini < u.minutosDe(proximo.hora))) proximo = i;
    });

    return { agora: agora, proximo: proximo };
  }

  /* Intervalos ocupados, em minutos desde a meia-noite. */
  function ocupacao(iso) {
    return itensDoDia(iso)
      .filter(function (i) { return u.minutosDe(i.hora) !== null && i.duracao > 0; })
      .map(function (i) {
        var ini = u.minutosDe(i.hora);
        return { ini: ini, fim: ini + i.duracao, titulo: i.titulo, area: i.area, fixo: i.fixo, tipo: i.tipo };
      })
      .sort(function (a, b) { return a.ini - b.ini; });
  }

  /* Espaços livres de pelo menos `minimo` minutos. */
  function vagos(ocupados, de, ate, minimo) {
    var livres = [], cursor = de;
    ocupados.slice().sort(function (a, b) { return a.ini - b.ini; }).forEach(function (o) {
      if (o.ini > cursor) livres.push({ ini: cursor, fim: Math.min(o.ini, ate) });
      cursor = Math.max(cursor, o.fim);
    });
    if (cursor < ate) livres.push({ ini: cursor, fim: ate });
    return livres.filter(function (l) { return l.fim - l.ini >= (minimo || 15); });
  }

  /* ------------------------------------------- análise do dia -- */

  function tarefasDoDia(iso) {
    return e().tarefas.filter(function (t) { return !t.feita && t.data === iso; });
  }

  function minutosDeDescanso(iso) {
    return itensDoDia(iso).reduce(function (soma, i) {
      var descanso = i.area === 'descanso' || i.area === 'hobby' || i.area === 'pessoal';
      return soma + (descanso ? (i.duracao || 0) : 0);
    }, 0);
  }

  /* Devolve avisos gentis, cada um com uma ação opcional. */
  function analisarDia(iso) {
    var avisos = [];
    var itens = itensDoDia(iso);
    var tarefas = tarefasDoDia(iso);

    /* 1. O que foi acrescentado não cabe no que sobrou.
       A rotina que ela desenhou de propósito não é motivo de alarme:
       o aviso é sobre a carga extra — tarefas e compromissos do dia. */
    var livre = vagos(ocupacao(iso), acordar(), dormir(), 15)
      .reduce(function (soma, v) { return soma + (v.fim - v.ini); }, 0);
    var extra = tarefas.reduce(function (soma, t) { return soma + (t.estimativa || 30); }, 0);

    if (extra > 0 && extra > livre) {
      avisos.push({
        chave: 'cheio',
        tom: 'atencao',
        titulo: 'Seu dia está cheio demais',
        texto: 'São ' + u.horasTexto(extra) + ' de tarefas para ' + u.horasTexto(livre) +
               ' livres entre os compromissos. Quer escolher o que fica?',
        acao: { rotulo: 'Reorganizar', rota: '#/assistente?modo=reorganizar&dia=' + iso }
      });
    }

    /* 2. Coisas demais acrescentadas na mesma faixa do dia. */
    var faixas = [[6 * 60, 12 * 60, 'de manhã'], [12 * 60, 18 * 60, 'entre 12h e 18h'], [18 * 60, 24 * 60, 'à noite']];
    faixas.forEach(function (f) {
      /* Só compromissos entram aqui: tarefas não têm hora e já são
         tratadas pelo aviso anterior. */
      var eventos = itens.filter(function (i) {
        var m = u.minutosDe(i.hora);
        return i.tipo === 'evento' && m !== null && m >= f[0] && m < f[1];
      }).length;

      if (eventos >= 3) {
        avisos.push({
          chave: 'concentracao',
          tom: 'atencao',
          titulo: 'Muito compromisso ' + f[2],
          texto: 'São ' + eventos + ' compromissos nesse intervalo, além da sua rotina. Quer reorganizar?',
          acao: { rotulo: 'Ver sugestão', rota: '#/assistente?modo=reorganizar&dia=' + iso }
        });
      }
    });

    /* 3. Nenhum descanso previsto — o aviso mais importante do app */
    if (itens.length >= 3 && minutosDeDescanso(iso) < 30) {
      avisos.push({
        chave: 'descanso',
        tom: 'cuidado',
        titulo: 'Seu dia não tem nenhum período de descanso',
        texto: 'Quer reservar 30 minutos só para respirar?',
        acao: { rotulo: 'Reservar 30 min', executar: function () { return reservarDescanso(iso, 30); } }
      });
    }

    /* 4. Horários que se atropelam */
    /* Rituais são flexíveis, então não entram na conta de sobreposição. */
    var oc = ocupacao(iso).filter(function (o) { return o.tipo !== 'ritual'; });
    for (var k = 1; k < oc.length; k++) {
      if (oc[k].ini < oc[k - 1].fim) {
        avisos.push({
          chave: 'conflito',
          tom: 'atencao',
          titulo: 'Dois horários se sobrepõem',
          texto: '"' + oc[k - 1].titulo + '" e "' + oc[k].titulo + '" acontecem ao mesmo tempo, às ' + u.hhmm(oc[k].ini) + '.',
          acao: { rotulo: 'Ver agenda', rota: '#/agenda' }
        });
        break;
      }
    }

    /* 5. Noite curta */
    var horasDeSono = ((acordar() + 1440) - dormir()) / 60;
    if (horasDeSono < 7) {
      avisos.push({
        chave: 'sono',
        tom: 'cuidado',
        titulo: 'Sua noite está curta',
        texto: 'Entre dormir às ' + e().ajustes.dormir + ' e acordar às ' + e().ajustes.acordar +
               ' são ' + horasDeSono.toFixed(1).replace('.', ',') + ' horas. Dormir também é rotina.',
        acao: { rotulo: 'Ajustar horários', rota: '#/ajustes' }
      });
    }

    return avisos;
  }

  /* Encontra o primeiro espaço livre e cria um descanso ali. */
  function reservarDescanso(iso, minutos) {
    var livres = vagos(ocupacao(iso), Math.max(acordar(), iso === u.hoje() ? u.agoraMin() : acordar()), dormir(), minutos);
    if (!livres.length) return false;
    var alvo = livres.sort(function (a, b) { return (b.fim - b.ini) - (a.fim - a.ini); })[0];
    var inicio = alvo.ini;

    store().commit(function (s) {
      s.eventos.push({
        id: u.id(), titulo: 'Descanso', data: iso, hora: u.hhmm(inicio),
        duracao: minutos, area: 'descanso', local: '', nota: 'Reservado para você respirar.'
      });
    });
    return u.hhmm(inicio);
  }

  /* ------------------------------------ o que fazer agora ----- */

  /* Escolhe as melhores atividades para o tempo livre informado. */
  function melhorAgora(minutos, iso) {
    var hojeISO = iso || u.hoje();
    var candidatos = [];

    e().tarefas.forEach(function (t) {
      if (t.feita) return;
      var est = t.estimativa || 30;
      if (est > minutos + 5) return;
      var pontos = t.prioridade * 12;
      var motivo = [];
      if (t.prioridade === 3) motivo.push('é prioridade');
      if (t.data && t.data < hojeISO) { pontos += 20; motivo.push('está atrasada'); }
      else if (t.data === hojeISO) { pontos += 12; motivo.push('é de hoje'); }
      if (est <= minutos * 0.8) motivo.push('cabe no seu tempo');
      candidatos.push({
        tipo: 'tarefa', ref: t, titulo: t.titulo, minutos: est, area: t.area,
        pontos: pontos, porque: motivo.join(' e ')
      });
    });

    e().disciplinas.forEach(function (d) {
      d.topicos.forEach(function (t) {
        if (t.status === 'ok' && t.ultimaRevisao && u.diasEntre(t.ultimaRevisao, hojeISO) < 7) return;
        var est = Math.min(minutos, minutos >= 50 ? 50 : 25);
        if (est < 10) return;
        var pontos = t.status === 'estudando' ? 26 : (t.status === 'nao' ? 20 : 10);
        if (minutos >= 45) pontos += 6;   /* tempo longo pede conteúdo, não recado */
        var motivo = [t.status === 'estudando' ? 'você já começou esse conteúdo'
          : (t.status === 'ok' ? 'faz tempo que você não revisa' : 'ainda não foi estudado')];
        candidatos.push({
          tipo: 'estudo', ref: t, disciplina: d, titulo: 'Estudar ' + t.nome,
          minutos: est, area: 'estudo', pontos: pontos, porque: motivo.join('')
        });
      });
    });

    store().cuidadosDeHoje(hojeISO).forEach(function (c) {
      if (store().feito('cuidados', c.id, hojeISO)) return;
      var atraso = c.ultimaVez ? u.diasEntre(store().proximaVez(c), hojeISO) : 0;
      if (minutos < 10) return;
      candidatos.push({
        tipo: 'cuidado', ref: c, titulo: c.titulo, minutos: Math.min(minutos, 20), area: 'autocuidado',
        pontos: 14 + Math.min(atraso * 2, 12),
        porque: atraso > 0 ? 'está ' + u.plural(atraso, 'dia atrasado', 'dias atrasado') : 'é o dia dele'
      });
    });

    e().objetivos.forEach(function (o) {
      if (o.arquivado) return;
      var passo = o.passos.filter(function (p) { return !p.feito; })[0];
      if (!passo) return;
      var pontos = 12;
      var motivo = 'aproxima você do objetivo "' + o.titulo + '"';
      if (o.prazo) {
        var faltam = u.diasEntre(hojeISO, o.prazo);
        if (faltam >= 0 && faltam <= 7) { pontos += 14; motivo = 'faltam ' + u.plural(faltam, 'dia', 'dias') + ' para "' + o.titulo + '"'; }
      }
      candidatos.push({
        tipo: 'passo', ref: passo, objetivo: o, titulo: passo.titulo,
        minutos: Math.min(minutos, 30), area: 'pessoal', pontos: pontos, porque: motivo
      });
    });

    /* Se o dia está sem descanso, descansar vira a melhor sugestão. */
    if (minutosDeDescanso(hojeISO) < 30 && minutos >= 20) {
      candidatos.push({
        tipo: 'descanso', titulo: 'Descansar de verdade', minutos: Math.min(minutos, 45),
        area: 'descanso', pontos: 30, porque: 'seu dia ainda não teve pausa nenhuma'
      });
    }

    return candidatos.sort(function (a, b) { return b.pontos - a.pontos; }).slice(0, 3);
  }

  /* --------------------------------- assistente de texto ------ */

  var NUMEROS = {
    'um': 1, 'uma': 1, 'dois': 2, 'duas': 2, 'tres': 3, 'quatro': 4, 'cinco': 5,
    'seis': 6, 'sete': 7, 'oito': 8, 'nove': 9, 'dez': 10, 'meia': 0.5, 'meio': 0.5
  };

  /* Palavra-chave → área, título sugerido e duração padrão. */
  var DICIONARIO = [
    { re: /(aula|escola|colegio|cursinho|faculdade)/, area: 'escola', titulo: 'Escola', dur: 240, fixo: true },
    { re: /(estud|revis|prova|vestibular|enem|exercicios de|materia|licao|dever)/, area: 'estudo', titulo: 'Estudo', dur: 60 },
    { re: /(academia|treino|exercicio|correr|corrida|caminhada|alongamento|pilates|danca)/, area: 'exercicio', titulo: 'Exercício', dur: 45 },
    { re: /(almoc)/, area: 'alimentacao', titulo: 'Almoço', dur: 45 },
    { re: /(jantar|janta)/, area: 'alimentacao', titulo: 'Jantar', dur: 40 },
    { re: /(cafe da manha|lanche|comer)/, area: 'alimentacao', titulo: 'Refeição', dur: 30 },
    { re: /(descans|relax|respirar|pausa|folga|nada)/, area: 'descanso', titulo: 'Descanso', dur: 60 },
    { re: /(dormir|deitar|sono|soneca|cochilo)/, area: 'sono', titulo: 'Dormir', dur: 30 },
    { re: /(arrumar|limpar|organizar|faxina|louca|roupa|quarto|casa|cozinha)/, area: 'casa', titulo: 'Arrumar a casa', dur: 45 },
    { re: /(skincare|cabelo|unha|banho|higiene|cuidar de mim|autocuidado|maquiagem)/, area: 'autocuidado', titulo: 'Autocuidado', dur: 30 },
    { re: /(orac|reza|rezar|missa|igreja|biblia|terco|rosario|adoracao|espiritual|meditar)/, area: 'espiritual', titulo: 'Momento de oração', dur: 20 },
    { re: /(consulta|dentista|medic|reuniao|encontro|compromisso|aniversario|entrevista|prova de)/, area: 'compromisso', titulo: 'Compromisso', dur: 60, fixo: true },
    { re: /(ler|leitura|desenh|filme|serie|musica|tocar|jogar|hobby|pintar|escrever)/, area: 'hobby', titulo: 'Hobby', dur: 45 },
    { re: /(passear|sair|amig|familia|conversar|namor)/, area: 'pessoal', titulo: 'Tempo com quem eu gosto', dur: 90 }
  ];

  function horaDoTexto(h, m) {
    var hora = Number(h);
    if (isNaN(hora)) return null;
    if (hora > 23) return null;
    return hora * 60 + (Number(m) || 0);
  }

  function extrairDuracao(t) {
    var mMin = t.match(/(\d{1,3})\s*(?:min|minutos?)\b/);
    if (mMin) return Number(mMin[1]);

    var mH = t.match(/(\d{1,2}|uma|duas|tres|quatro|cinco|meia)\s*(?:h\b|horas?\b)/);
    if (mH) {
      var v = NUMEROS[mH[1]] !== undefined ? NUMEROS[mH[1]] : Number(mH[1]);
      /* "às 8h" não é duração: só conta quando não há preposição de horário antes. */
      if (!/\b(as|às|ate|até|das|de)\s*$/.test(t.slice(0, mH.index).trim() + ' ')) return Math.round(v * 60);
    }
    return null;
  }

  function extrairFaixa(t) {
    var m = t.match(/(?:das?|de)\s*(\d{1,2})(?:[:h](\d{2}))?\s*(?:as|às|ate|até|a|-|until)\s*(\d{1,2})(?:[:h](\d{2}))?/);
    if (!m) return null;
    var ini = horaDoTexto(m[1], m[2]), fim = horaDoTexto(m[3], m[4]);
    if (ini === null || fim === null) return null;
    return { ini: ini, fim: fim > ini ? fim : fim + 720 };
  }

  function extrairFim(t) {
    if (/ate\s*o?\s*meio-?\s?dia/.test(t)) return 12 * 60;
    if (/ate\s*a?\s*meia-?\s?noite/.test(t)) return 24 * 60;
    var m = t.match(/ate\s*(?:as\s*)?(\d{1,2})(?:[:h](\d{2}))?/);
    return m ? horaDoTexto(m[1], m[2]) : null;
  }

  function extrairInicio(t) {
    if (/(as|às)\s*meio-?\s?dia/.test(t)) return 12 * 60;
    var m = t.match(/(?:as|às|comeca|comeco|inicio)\s*(\d{1,2})(?:[:h](\d{2}))?/);
    if (m) return horaDoTexto(m[1], m[2]);
    m = t.match(/\b(\d{1,2})[:h](\d{2})\b/);
    if (m) return horaDoTexto(m[1], m[2]);
    return null;
  }

  function classificar(seg) {
    for (var i = 0; i < DICIONARIO.length; i++) {
      if (DICIONARIO[i].re.test(seg)) return DICIONARIO[i];
    }
    return null;
  }

  /* Título natural a partir do trecho escrito, preservando os acentos. */
  function tituloDoSegmento(seg, padrao) {
    var limpo = String(seg)
      /* "amanhã", "hoje" e conjunções no começo da frase */
      .replace(/^\s*(?:hoje|amanhã|amanha|depois de amanhã|então|entao|aí|ai)\s+/i, '')
      .replace(/\b(preciso|quero|queria|gostaria de|tenho que|tenho|vou|hoje|amanhã|amanha|ainda|um pouco|de novo|por favor)\b/gi, ' ')
      /* durações primeiro: "40 minutos", "3 horas", "duas horas" */
      .replace(/\b\d{1,3}\s*(?:minutos?|mins?|horas?|hrs?|h)\b/gi, ' ')
      .replace(/\b(?:um|uma|dois|duas|três|tres|quatro|cinco|seis|meia|meio)\s+(?:minutos?|horas?)\b/gi, ' ')
      /* depois os horários: "das 8 às 12", "às 15h", "até meio-dia" */
      .replace(/\b(?:até|ate)\s*o?\s*meio-?\s?dia\b/gi, ' ')
      .replace(/\b(?:até|ate)\s*a?\s*meia-?\s?noite\b/gi, ' ')
      .replace(/\b(?:das?|de|às|as|até|ate)\s*\d{1,2}\s*(?::\d{2}|h\d{2}|h\b)?/gi, ' ')
      .replace(/[,;.]/g, ' ')
      .replace(/\s+/g, ' ')
      .replace(/\s*\b(de|da|do|em|por|pra|para|no|na|com)\s*$/i, '')
      .trim();

    if (limpo.length < 3 || limpo.length > 42) return padrao;
    return u.maiuscula(limpo);
  }

  /* Lê a frase e devolve os itens desejados, ainda sem horário definido. */
  function interpretar(texto) {
    var bruto = String(texto || '').replace(/\s+/g, ' ').trim();
    var segmentos = bruto
      .split(/\s*[,;.]\s*|\s+\be\b\s+|\s+\bdepois\b\s+|\s+\btamb[ée]m\b\s+/i)
      .map(function (x) { return (x || '').trim(); })
      .filter(function (x) { return x.length > 2; });

    var itens = [];
    segmentos.forEach(function (seg) {
      var sm = u.simples(seg);
      var d = classificar(sm);
      if (!d) return;

      var faixa = extrairFaixa(sm);
      var dur = extrairDuracao(sm);
      var inicio = faixa ? faixa.ini : extrairInicio(sm);
      var fim = faixa ? faixa.fim : extrairFim(sm);

      var duracao = dur || (fim !== null && inicio !== null ? fim - inicio : null) || d.dur;
      if (fim !== null && inicio === null && d.fixo) inicio = Math.max(0, fim - duracao);

      itens.push({
        titulo: tituloDoSegmento(seg, d.titulo),
        area: d.area,
        duracao: Math.max(10, Math.min(duracao, 480)),
        inicio: inicio,
        fixo: !!(d.fixo || faixa || inicio !== null)
      });
    });

    return itens;
  }

  /* Distribui os itens pelo dia, respeitando o que já existe na rotina. */
  function montarPlano(iso, itens) {
    var inicioDia = acordar(), fimDia = dormir();
    var ocupados = [];
    var plano = [];

    /* Tudo o que já está no dia continua valendo e vira âncora.
       Rituais são flexíveis: aparecem no plano, mas não bloqueiam horário. */
    itensDoDia(iso).forEach(function (i) {
      var ini = u.minutosDe(i.hora);
      if (ini === null || !i.duracao) return;
      if (i.tipo !== 'ritual') ocupados.push({ ini: ini, fim: ini + i.duracao });
      plano.push({
        hora: u.hhmm(ini), duracao: i.duracao, titulo: i.titulo, area: i.area,
        origem: 'existente', fixo: i.fixo || i.tipo === 'evento', flexivel: i.tipo === 'ritual'
      });
    });

    /* Depois, o que a frase pediu com horário marcado. */
    var pedidosFixos = itens.filter(function (i) { return i.fixo && i.inicio !== null; });
    pedidosFixos.forEach(function (i) {
      ocupados.push({ ini: i.inicio, fim: i.inicio + i.duracao });
      plano.push({ hora: u.hhmm(i.inicio), duracao: i.duracao, titulo: i.titulo, area: i.area, origem: 'pedido' });
    });

    /* Encaixa no primeiro espaço que comporta a atividade inteira;
       se nenhum couber, usa o maior espaço disponível. */
    function encaixar(titulo, duracao, area, origem, depoisDe) {
      var de = Math.max(inicioDia, depoisDe || inicioDia);
      var livres = vagos(ocupados, de, fimDia, 15);
      if (!livres.length) return null;

      var cabe = livres.filter(function (l) { return l.fim - l.ini >= duracao; })[0];
      var alvo = cabe || livres.slice().sort(function (a, b) { return (b.fim - b.ini) - (a.fim - a.ini); })[0];
      var dur = Math.min(duracao, alvo.fim - alvo.ini);
      if (dur < 10) return null;

      ocupados.push({ ini: alvo.ini, fim: alvo.ini + dur });
      plano.push({ hora: u.hhmm(alvo.ini), duracao: dur, titulo: titulo, area: area, origem: origem });
      return alvo.ini + dur;
    }

    /* Se um compromisso novo cai em cima de algo flexível da rotina,
       esse algo é remarcado em vez de simplesmente sumir. */
    var deslocados = [];
    if (pedidosFixos.length) {
      plano = plano.filter(function (p) {
        if (p.origem !== 'existente' || p.fixo || p.flexivel) return true;
        var ini = u.minutosDe(p.hora), fim = ini + p.duracao;
        var bate = pedidosFixos.some(function (i) { return ini < i.inicio + i.duracao && fim > i.inicio; });
        if (!bate) return true;
        ocupados = ocupados.filter(function (o) { return !(o.ini === ini && o.fim === fim); });
        deslocados.push(p);
        return false;
      });
    }
    deslocados.forEach(function (p) {
      encaixar(p.titulo, p.duracao, p.area, 'movido');
    });

    /* Refeição vira âncora quando o dia ainda não tem nenhuma no horário. */
    var temAlmoco = plano.some(function (p) {
      var m = u.minutosDe(p.hora);
      return p.area === 'alimentacao' && m >= 11 * 60 && m <= 15 * 60;
    });
    var pediuAlmoco = itens.some(function (i) { return i.area === 'alimentacao'; });
    if (!temAlmoco && !pediuAlmoco && fimDia > 13 * 60) {
      var livreAlmoco = vagos(ocupados, 12 * 60, 15 * 60, 30)[0];
      if (livreAlmoco) {
        ocupados.push({ ini: livreAlmoco.ini, fim: livreAlmoco.ini + 45 });
        plano.push({ hora: u.hhmm(livreAlmoco.ini), duracao: 45, titulo: 'Almoço', area: 'alimentacao', origem: 'sugerido' });
      }
    }

    /* Os flexíveis, na ordem pedida. Estudo longo é quebrado com pausas. */
    itens.filter(function (i) { return !(i.fixo && i.inicio !== null); }).forEach(function (i) {
      if (i.area === 'estudo' && i.duracao > 60) {
        var restante = i.duracao, n = 0, cursor = null;
        while (restante > 0 && n < 4) {
          var pedaco = Math.min(60, restante);
          cursor = encaixar(i.titulo + (n ? ' (parte ' + (n + 1) + ')' : ''), pedaco, i.area, 'plano', cursor);
          if (cursor === null) break;
          restante -= pedaco;
          if (restante > 0) cursor = encaixar('Pausa', 15, 'descanso', 'pausa', cursor);
          n++;
        }
      } else {
        encaixar(i.titulo, i.duracao, i.area, 'plano');
      }
    });

    /* Descanso é obrigatório: se o plano não tem nenhum, o app reserva. */
    var temDescanso = plano.some(function (p) {
      return (p.area === 'descanso' || p.area === 'hobby') && p.duracao >= 30;
    });
    if (!temDescanso) encaixar('Descanso', 45, 'descanso', 'cuidado');

    plano.sort(function (a, b) { return u.minutosDe(a.hora) - u.minutosDe(b.hora); });

    /* O que sobrar no fim do dia é tempo livre, não tarefa. */
    var ultimo = plano.reduce(function (max, p) { return Math.max(max, u.minutosDe(p.hora) + p.duracao); }, inicioDia);
    if (fimDia - ultimo >= 45) {
      plano.push({ hora: u.hhmm(ultimo), duracao: fimDia - ultimo, titulo: 'Tempo livre', area: 'pessoal', origem: 'livre' });
    }

    return plano;
  }

  function planejarTexto(texto, iso) {
    var itens = interpretar(texto);
    return { itens: itens, plano: itens.length ? montarPlano(iso, itens) : [] };
  }

  /* Grava o plano aceito como compromissos daquele dia. */
  function aplicarPlano(iso, plano, substituirRotina) {
    store().commit(function (s) {
      s.eventos = s.eventos.filter(function (ev) { return ev.data !== iso || ev.origemPlano !== true; });
      plano.forEach(function (p) {
        if (p.origem === 'existente') return;
        s.eventos.push({
          id: u.id(), titulo: p.titulo, data: iso, hora: p.hora, duracao: p.duracao,
          area: p.area, local: '', nota: '', origemPlano: true
        });
      });
      if (substituirRotina) store().dia(iso).somentePlano = true;
    });
  }

  /* ------------------------------------- estudos: distribuir -- */

  /* Espalha conteúdos pelos dias até o prazo, virando tarefas de estudo. */
  function distribuirEstudos(topicoIds, ate, minutosPorDia) {
    var inicio = u.hoje();
    var total = Math.max(1, u.diasEntre(inicio, ate) + 1);
    var dias = [];
    for (var i = 0; i < total; i++) dias.push(u.somarDias(inicio, i));

    var criadas = [];
    topicoIds.forEach(function (tid, idx) {
      var t = store().topico(tid);
      if (!t) return;
      var d = store().disciplinaDoTopico(tid);
      var dia = dias[idx % dias.length];
      criadas.push({
        id: u.id(),
        titulo: 'Estudar ' + t.nome + (d ? ' · ' + d.nome : ''),
        data: dia, feita: false, prioridade: 3,
        estimativa: minutosPorDia || 40, area: 'estudo',
        objetivoId: null, criadaEm: inicio, topicoId: tid
      });
    });

    store().commit(function (s) { s.tarefas = s.tarefas.concat(criadas); });
    return criadas;
  }

  /* ------------------------------------------ painel semanal -- */

  function resumoSemana(iso) {
    var dias = u.diasDaSemana(iso || u.hoje());
    var estudoMin = 0, descansoMin = 0, exercicios = 0, autocuidado = 0, espiritual = 0;
    var sono = [], concluidas = 0, previstas = 0, diasComDescanso = 0;

    e().sessoes.forEach(function (s) {
      if (dias.indexOf(s.data) !== -1) estudoMin += s.minutos;
    });

    dias.forEach(function (d) {
      var teveDescanso = false;
      itensDoDia(d).forEach(function (i) {
        if (!i.feito) return;
        if (i.area === 'estudo' || i.area === 'escola') estudoMin += i.duracao || 0;
        if (i.area === 'descanso' || i.area === 'hobby') { descansoMin += i.duracao || 0; teveDescanso = true; }
        if (i.area === 'exercicio') exercicios++;
        if (i.area === 'autocuidado') autocuidado++;
      });
      if (teveDescanso) diasComDescanso++;

      var reg = e().registro[d] || {};
      autocuidado += Object.keys(reg.cuidados || {}).length;
      espiritual += Object.keys(reg.praticas || {}).length;
      if (reg.revisao && reg.revisao.sono) sono.push(Number(reg.revisao.sono));

      e().tarefas.forEach(function (t) {
        if (t.data !== d) return;
        previstas++;
        if (t.feita) concluidas++;
      });
    });

    var mediaSono = sono.length ? (sono.reduce(function (a, b) { return a + b; }, 0) / sono.length) : null;

    return {
      dias: dias,
      estudoMin: estudoMin,
      descansoMin: descansoMin,
      exercicios: exercicios,
      autocuidado: autocuidado,
      espiritual: espiritual,
      mediaSono: mediaSono,
      diasComDescanso: diasComDescanso,
      tarefas: { feitas: concluidas, total: previstas, pct: u.pct(concluidas, previstas) }
    };
  }

  /* Leitura gentil da semana — elogia o que houve, não cobra o que faltou. */
  function leituraDaSemana(r) {
    var frases = [];
    if (r.estudoMin >= 300) frases.push('Você estudou ' + u.horasTexto(r.estudoMin) + ' — é bastante coisa.');
    else if (r.estudoMin > 0) frases.push('Foram ' + u.horasTexto(r.estudoMin) + ' de estudo nesta semana.');

    if (r.diasComDescanso >= 5) frases.push('E, o mais importante: você descansou quase todos os dias.');
    else if (r.diasComDescanso >= 2) frases.push('Você conseguiu descansar em ' + u.plural(r.diasComDescanso, 'dia', 'dias') + '.');
    else frases.push('Quase não houve pausa nesta semana. Que tal reservar uma para a próxima?');

    if (r.mediaSono !== null) {
      frases.push(r.mediaSono >= 7.5
        ? 'Sua média de sono foi boa: ' + r.mediaSono.toFixed(1).replace('.', ',') + 'h por noite.'
        : 'A média de sono ficou em ' + r.mediaSono.toFixed(1).replace('.', ',') + 'h — seu corpo agradece um pouco mais.');
    }

    if (r.exercicios) frases.push(u.plural(r.exercicios, 'sessão de exercício', 'sessões de exercício') + ' também entraram na conta.');

    return frases;
  }

  /* ------------------------------------------ frase do dia ---- */

  var FRASES = [
    'Viva bem o dia de hoje.',
    'Uma coisa de cada vez.',
    'Descansar também é cumprir a rotina.',
    'Comece pequeno; começar já é bastante.',
    'O que importa hoje cabe em poucas linhas.',
    'Você não precisa dar conta de tudo ao mesmo tempo.',
    'Faça com calma o que dá para fazer com calma.',
    'Seu ritmo é um ritmo válido.',
    'Cuidar de você faz parte do plano.',
    'O dia é seu; a lista é só um apoio.'
  ];

  function fraseDoDia(iso) {
    var d = u.fromISO(iso || u.hoje());
    var n = (d.getFullYear() * 372 + d.getMonth() * 31 + d.getDate()) % FRASES.length;
    return FRASES[n];
  }

  /* ------------------------------- calendário litúrgico -------- */

  /* Domingo de Páscoa pelo cálculo de Gauss/Meeus (rito romano). */
  function pascoa(ano) {
    var a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;
    var d = Math.floor(b / 4), e2 = b % 4, f = Math.floor((b + 8) / 25);
    var g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    var i = Math.floor(c / 4), k = c % 4;
    var l = (32 + 2 * e2 + 2 * i - h - k) % 7;
    var m = Math.floor((a + 11 * h + 22 * l) / 451);
    var mes = Math.floor((h + l - 7 * m + 114) / 31);
    var dia = ((h + l - 7 * m + 114) % 31) + 1;
    return u.toISO(new Date(ano, mes - 1, dia));
  }

  /* Cores litúrgicas: violeta (Advento/Quaresma), ouro (Natal/Páscoa),
     rubro (Pentecostes) e verde (Tempo Comum), em versões para papel e
     para tinta escura. São elas que dão o acento da interface. */
  var PALETA = {
    Advento:        { claro: ['#5A4E77', '#EFEDF4', '#493E63'], escuro: ['#A99CC9', '#232037', '#BDB2DA'] },
    Natal:          { claro: ['#8A6D2F', '#F8F1E1', '#6F5722'], escuro: ['#C9A961', '#2A2416', '#DCC07E'] },
    Quaresma:       { claro: ['#574A63', '#EEECF1', '#443A4E'], escuro: ['#9E93AE', '#211E27', '#B4A9C3'] },
    'Páscoa':       { claro: ['#93722F', '#F9F2E0', '#775B21'], escuro: ['#D2B268', '#2B2517', '#E3C888'] },
    Pentecostes:    { claro: ['#8C2F39', '#F6EDEA', '#73242D'], escuro: ['#C4737B', '#2C1F20', '#D68D94'] },
    'Tempo Comum':  { claro: ['#4C6650', '#EDF1EA', '#3C5240'], escuro: ['#8FA98A', '#22271F', '#A6BCA0'] }
  };

  function tempoLiturgico(iso) {
    var data = iso || u.hoje();
    var ano = u.fromISO(data).getFullYear();
    var p = pascoa(ano);
    var cinzas = u.somarDias(p, -46);
    var pentecostes = u.somarDias(p, 49);
    var natal = ano + '-12-25';

    /* Primeiro domingo do Advento: quatro domingos antes do Natal. */
    var dowNatal = u.diaDaSemana(natal);
    var advento = u.somarDias(natal, -(dowNatal === 0 ? 28 : 21 + dowNatal));

    var tempo, nota;
    if (data === pentecostes) { tempo = 'Pentecostes'; nota = 'Solenidade do Espírito Santo.'; }
    else if (data >= advento && data < natal) { tempo = 'Advento'; nota = 'Tempo de espera e preparação.'; }
    else if (data >= natal || data <= ano + '-01-06') { tempo = 'Natal'; nota = 'Tempo de alegria.'; }
    else if (data >= cinzas && data < p) { tempo = 'Quaresma'; nota = 'Tempo de silêncio e conversão.'; }
    else if (data >= p && data <= pentecostes) { tempo = 'Páscoa'; nota = 'Tempo de vida nova.'; }
    else { tempo = 'Tempo Comum'; nota = 'Tempo de caminhada cotidiana.'; }

    var par = PALETA[tempo] || PALETA['Tempo Comum'];
    return {
      tempo: tempo,
      nota: nota,
      cor: par.claro[0],
      paleta: par,
      /* datas de referência, úteis para quem quiser conferir */
      pascoa: p, cinzas: cinzas, pentecostes: pentecostes, advento: advento
    };
  }

  /* Trio [cor, suave, forte] para o tema em uso. */
  function paletaLiturgica(iso, escuro) {
    var lit = tempoLiturgico(iso);
    return { tempo: lit.tempo, cores: escuro ? lit.paleta.escuro : lit.paleta.claro };
  }

  App.motor = {
    acordar: acordar,
    dormir: dormir,
    somentePlano: somentePlano,
    itensDoDia: itensDoDia,
    porPeriodo: porPeriodo,
    agoraEDepois: agoraEDepois,
    ocupacao: ocupacao,
    vagos: vagos,
    tarefasDoDia: tarefasDoDia,
    minutosDeDescanso: minutosDeDescanso,
    analisarDia: analisarDia,
    reservarDescanso: reservarDescanso,
    melhorAgora: melhorAgora,
    interpretar: interpretar,
    montarPlano: montarPlano,
    planejarTexto: planejarTexto,
    aplicarPlano: aplicarPlano,
    distribuirEstudos: distribuirEstudos,
    resumoSemana: resumoSemana,
    leituraDaSemana: leituraDaSemana,
    fraseDoDia: fraseDoDia,
    tempoLiturgico: tempoLiturgico,
    paletaLiturgica: paletaLiturgica
  };
})();

</script>
  <script>
/* Peças de interface reaproveitadas por todas as telas. */
(function () {
  'use strict';

  var App = window.App;
  var u = App.util;
  var el = u.el;

  var fundo, painel, painelTitulo, painelForm, recadoEl, recadoTimer;

  function iniciar() {
    fundo = document.getElementById('fundoPainel');
    painel = document.getElementById('painel');
    painelTitulo = document.getElementById('painelTitulo');
    painelForm = document.getElementById('painelForm');
    recadoEl = document.getElementById('recado');

    fundo.addEventListener('click', function (ev) { if (ev.target === fundo) fechar(); });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && !fundo.hidden) fechar();
    });
  }

  function aviso(msg) {
    recadoEl.textContent = msg;
    recadoEl.hidden = false;
    clearTimeout(recadoTimer);
    recadoTimer = setTimeout(function () { recadoEl.hidden = true; }, 2400);
  }

  function fechar() {
    fundo.hidden = true;
    painelForm.innerHTML = '';
    painelForm.onsubmit = null;
  }

  /* ---------------------------------------- formulário em painel */

  function campo(def, valores) {
    var wrap = el('div.campo');
    var idc = 'c_' + def.nome;
    var ler;

    wrap.appendChild(el('label', { for: def.tipo === 'dias' || def.tipo === 'opcoes' ? null : idc, text: def.rotulo }));

    if (['texto', 'hora', 'numero', 'data'].indexOf(def.tipo) !== -1) {
      var tipos = { texto: 'text', hora: 'time', numero: 'number', data: 'date' };
      var input = el('input', {
        id: idc, type: tipos[def.tipo],
        value: valores[def.nome] === null || valores[def.nome] === undefined ? '' : valores[def.nome],
        placeholder: def.dica || '', min: def.min, max: def.max, step: def.passo,
        inputmode: def.tipo === 'numero' ? 'numeric' : null, autocomplete: 'off'
      });
      wrap.appendChild(input);
      ler = function () {
        var v = input.value.trim();
        return def.tipo === 'numero' ? (v === '' ? 0 : Number(v)) : v;
      };

    } else if (def.tipo === 'texto-longo') {
      var area = el('textarea', { id: idc, placeholder: def.dica || '', rows: def.linhas || 3 });
      area.value = valores[def.nome] || '';
      wrap.appendChild(area);
      ler = function () { return area.value.trim(); };

    } else if (def.tipo === 'selecao') {
      var sel = el('select', { id: idc }, def.opcoes.map(function (o) {
        return el('option', { value: o.valor, text: o.rotulo, selected: String(valores[def.nome]) === String(o.valor) });
      }));
      wrap.appendChild(sel);
      ler = function () { return sel.value; };

    } else if (def.tipo === 'opcoes') {
      var escolhido = valores[def.nome];
      var caixa = el('div.opcoes');
      def.opcoes.forEach(function (o) {
        var b = el('button.opcao', {
          type: 'button', text: o.rotulo,
          'aria-pressed': String(escolhido) === String(o.valor) ? 'true' : 'false',
          onclick: function () {
            escolhido = o.valor;
            Array.prototype.forEach.call(caixa.children, function (c) { c.setAttribute('aria-pressed', 'false'); });
            b.setAttribute('aria-pressed', 'true');
          }
        });
        caixa.appendChild(b);
      });
      wrap.appendChild(caixa);
      ler = function () { return escolhido; };

    } else if (def.tipo === 'dias') {
      var marcados = (valores[def.nome] || []).slice();
      var linha = el('div.dias');
      u.DIAS_MINI.forEach(function (letra, i) {
        var ativo = marcados.indexOf(i) !== -1;
        var p = el('button.dias__pilula', {
          type: 'button', text: letra, title: u.DIAS_CURTOS[i],
          'aria-pressed': ativo ? 'true' : 'false',
          onclick: function () {
            var pos = marcados.indexOf(i);
            if (pos === -1) marcados.push(i); else marcados.splice(pos, 1);
            p.setAttribute('aria-pressed', pos === -1 ? 'true' : 'false');
          }
        });
        linha.appendChild(p);
      });
      wrap.appendChild(linha);
      ler = function () { return marcados.slice().sort(); };

    } else if (def.tipo === 'alternar') {
      var check = el('input', { id: idc, type: 'checkbox' });
      check.checked = !!valores[def.nome];
      check.style.width = 'auto';
      check.style.justifySelf = 'start';
      wrap.appendChild(check);
      ler = function () { return check.checked; };

    } else if (def.tipo === 'lista') {
      /* Lista editável de textos curtos (itens de ritual, passos de objetivo). */
      var itens = (valores[def.nome] || []).map(function (x) {
        return typeof x === 'string' ? { titulo: x } : Object.assign({}, x);
      });
      var caixaLista = el('div.pilha.pilha--junta');

      function desenhar() {
        caixaLista.innerHTML = '';
        itens.forEach(function (item, i) {
          var inp = el('input', {
            type: 'text', value: item.titulo, placeholder: 'Item',
            oninput: function () { item.titulo = inp.value; }
          });
          caixaLista.appendChild(el('div', { style: 'display:flex;gap:8px' }, [
            inp,
            el('button.btn.btn--p.btn--fantasma', {
              type: 'button', text: '×', 'aria-label': 'Remover item',
              onclick: function () { itens.splice(i, 1); desenhar(); }
            })
          ]));
        });
        caixaLista.appendChild(el('button.btn.btn--p.btn--suave', {
          type: 'button', text: '+ Adicionar item',
          onclick: function () { itens.push({ id: u.id(), titulo: '' }); desenhar(); }
        }));
      }
      desenhar();
      wrap.appendChild(caixaLista);
      ler = function () {
        return itens.filter(function (i) { return i.titulo.trim(); })
          .map(function (i) { return { id: i.id || u.id(), titulo: i.titulo.trim(), feito: !!i.feito }; });
      };
    }

    if (def.ajuda) wrap.appendChild(el('div.campo__dica', { text: def.ajuda }));
    return { node: wrap, ler: ler, def: def };
  }

  function abrirFormulario(op) {
    painelTitulo.textContent = op.titulo;
    painelForm.innerHTML = '';

    var valores = op.valores || {};
    var campos = op.campos.map(function (def) { return campo(def, valores); });

    campos.forEach(function (c) {
      var ultimo = painelForm.lastChild;
      if (c.def.junto && ultimo && ultimo.classList && ultimo.classList.contains('duo') && ultimo.childElementCount < 2) {
        ultimo.appendChild(c.node);
      } else if (c.def.junto) {
        painelForm.appendChild(el('div.duo', {}, [c.node]));
      } else {
        painelForm.appendChild(c.node);
      }
    });

    var acoes = el('div.linha-btn.linha-btn--fim', { style: 'margin-top:6px' }, [
      op.aoExcluir ? el('button.btn.btn--perigo', {
        type: 'button', text: 'Excluir',
        onclick: function () {
          if (confirm('Excluir "' + (valores.titulo || 'este item') + '"?')) { op.aoExcluir(); fechar(); }
        }
      }) : null,
      el('button.btn.btn--fantasma', { type: 'button', text: 'Cancelar', onclick: fechar }),
      el('button.btn.btn--principal', { type: 'submit', text: op.rotuloSalvar || 'Salvar' })
    ]);
    painelForm.appendChild(acoes);

    painelForm.onsubmit = function (ev) {
      ev.preventDefault();
      var out = {}, faltando = null;
      campos.forEach(function (c) {
        var v = c.ler();
        out[c.def.nome] = v;
        if (c.def.obrigatorio && (v === '' || v === null || (Array.isArray(v) && !v.length))) {
          faltando = faltando || c.def.rotulo;
        }
      });
      if (faltando) { aviso('Falta preencher: ' + faltando); return; }
      if (op.aoSalvar(out) !== false) fechar();
    };

    fundo.hidden = false;
    var primeiro = painelForm.querySelector('input[type="text"], textarea');
    if (primeiro) setTimeout(function () { primeiro.focus(); }, 80);
  }

  /* Painel com conteúdo livre (não é formulário). */
  function abrirPainel(titulo, filhos) {
    painelTitulo.textContent = titulo;
    painelForm.innerHTML = '';
    painelForm.onsubmit = function (ev) { ev.preventDefault(); };
    [].concat(filhos).forEach(function (f) { if (f) painelForm.appendChild(f); });
    fundo.hidden = false;
  }

  /* ------------------------------------------------- componentes */

  function ponto(cor) { return el('span.ponto', { style: 'background:' + cor }); }

  function etiqueta(texto, cor) {
    return el('span.etiqueta' + (cor ? '.etiqueta--' + cor : ''), { text: texto });
  }

  /* Item da linha do dia. */
  function itemLinha(op) {
    var classes = 'div.item' + (op.feito ? '.item--feito' : '') + (op.agora ? '.item--agora' : '')
      + (op.aoAbrir ? '.item--clicavel' : '');
    return el(classes, {}, [
      op.hora !== undefined ? el('span.item__hora', { text: op.hora || '—' }) : null,
      el('div.item__corpo', { onclick: op.aoAbrir || null }, [
        el('div.item__titulo', { text: op.titulo }),
        op.meta && op.meta.length ? el('div.item__meta', {}, op.meta) : null,
        op.nota ? el('div.item__nota', { text: op.nota }) : null,
        op.extra || null
      ]),
      op.aoMarcar ? el('button.check', {
        type: 'button', text: '✓',
        'aria-pressed': op.feito ? 'true' : 'false',
        'aria-label': (op.feito ? 'Desmarcar ' : 'Marcar ') + op.titulo,
        onclick: op.aoMarcar
      }) : (op.direita || null)
    ]);
  }

  function linhaCheck(titulo, feito, aoMarcar) {
    return el('div.check-linha' + (feito ? '.check-linha--feito' : ''), { onclick: aoMarcar }, [
      el('button.check', {
        type: 'button', text: '✓', 'aria-pressed': feito ? 'true' : 'false',
        'aria-label': (feito ? 'Desmarcar ' : 'Marcar ') + titulo,
        onclick: function (ev) { ev.stopPropagation(); aoMarcar(); }
      }),
      el('span', { text: titulo })
    ]);
  }

  function tituloSecao(texto, direita) {
    return el('div.titulo-secao', {}, [
      el('h2', { text: texto }),
      typeof direita === 'string' ? el('span', { text: direita }) : (direita || null)
    ]);
  }

  /* Ornamento tipográfico: filete, losango, filete. Usado com parcimônia. */
  function ornamento() {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 96 12');
    svg.setAttribute('aria-hidden', 'true');

    function traco(x1, x2) {
      var l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', '6');
      l.setAttribute('x2', x2); l.setAttribute('y2', '6');
      l.setAttribute('stroke', 'currentColor');
      l.setAttribute('stroke-width', '1');
      return l;
    }
    var losango = document.createElementNS(ns, 'path');
    losango.setAttribute('d', 'M48 2.4l3.4 3.6L48 9.6 44.6 6z');
    losango.setAttribute('fill', 'currentColor');

    svg.appendChild(traco(6, 40));
    svg.appendChild(losango);
    svg.appendChild(traco(56, 90));

    return el('div.ornamento', {}, [svg]);
  }

  function vazio(titulo, texto) {
    return el('div.vazio', {}, [el('strong', { text: titulo }), texto || '']);
  }

  function avisoCartao(a) {
    return el('div.aviso.aviso--' + (a.tom || 'cuidado'), {}, [
      el('div.aviso__titulo', { text: a.titulo }),
      el('div.aviso__texto', { text: a.texto }),
      a.acao ? el('button.btn.btn--p', {
        type: 'button', text: a.acao.rotulo,
        onclick: function () {
          if (a.acao.rota) location.hash = a.acao.rota;
          else if (a.acao.executar) {
            var r = a.acao.executar();
            aviso(r ? 'Pronto, reservei às ' + r : 'Não achei espaço livre no dia');
            App.render();
          }
        }
      }) : null
    ]);
  }

  function barraProgresso(porcento) {
    return el('div.progresso', { role: 'img', 'aria-label': porcento + '% concluído' }, [
      el('div.progresso__barra', { style: 'width:' + Math.max(2, porcento) + '%' })
    ]);
  }

  App.ui = {
    iniciar: iniciar, aviso: aviso, fechar: fechar,
    abrirFormulario: abrirFormulario, abrirPainel: abrirPainel,
    ponto: ponto, etiqueta: etiqueta, itemLinha: itemLinha, linhaCheck: linhaCheck,

  <script>
/* Tela "Hoje": a rotina do momento, com o essencial à vista. */
(function () {

  var App = window.App;
  var u = App.util, el = u.el, ui = App.ui;

  var dia = null;

  var PERIODOS = [
    { chave: 'manha', nome: 'Manhã' },
    { chave: 'tarde', nome: 'Tarde' },
    { chave: 'noite', nome: 'Noite' },
    { chave: 'flex', nome: 'Sem horário' }
  ];

  function estrelas(n) { return new Array(n + 1).join('★'); }

  /* ------------------------------------------------- cabeçalho */

  function cabecalho(store, motor) {
    var itens = motor.itensDoDia(dia);
    var tarefas = motor.tarefasDoDia(dia);
    var feitos = itens.filter(function (i) { return i.feito; }).length;
    var total = itens.length;
    var ehHoje = dia === u.hoje();

    var nome = store.estado.ajustes.nome;
    var hora = new Date().getHours();
    var saudacao = hora < 5 ? 'Boa madrugada' : (hora < 12 ? 'Bom dia' : (hora < 18 ? 'Boa tarde' : 'Boa noite'));

    return el('div.hoje-topo', {}, [
      nome && ehHoje ? el('div.mini.fraco', { text: saudacao + ', ' + nome }) : null,
      el('div.hoje-topo__data', { text: u.dataLonga(dia) }),
      el('div.hoje-topo__frase', { text: store.estado.ajustes.lema
        ? store.estado.ajustes.lema
        : '“' + motor.fraseDoDia(dia) + '”' }),
      el('div.hoje-topo__linha', {}, [
        ui.barraProgresso(u.pct(feitos, total)),
        el('span.mini.fraco', { text: total ? feitos + '/' + total : '—' })
      ]),
      el('div.linha-btn', { style: 'margin-top:12px' }, [
        el('button.btn.btn--p.btn--fantasma', {
          type: 'button', text: '‹ ' + u.dataCurta(u.somarDias(dia, -1)),
          onclick: function () { dia = u.somarDias(dia, -1); App.render(); }
        }),
        !ehHoje ? el('button.btn.btn--p.btn--suave', {
          type: 'button', text: 'Hoje',
          onclick: function () { dia = u.hoje(); App.render(); }
        }) : null,
        el('button.btn.btn--p.btn--fantasma', {
          type: 'button', text: u.dataCurta(u.somarDias(dia, 1)) + ' ›',
          onclick: function () { dia = u.somarDias(dia, 1); App.render(); }
        }),
        tarefas.length ? el('span.mini.fraco', { style: 'margin-left:auto;align-self:center',
          text: u.plural(tarefas.length, 'tarefa aberta', 'tarefas abertas') }) : null
      ])
    ].filter(Boolean));
  }

  /* ------------------------------------------------- agora ---- */

  function agora(motor) {
    if (dia !== u.hoje()) return null;
    var r = motor.agoraEDepois(dia);
    if (!r.agora && !r.proximo) return null;

    return el('div.cartao.cartao--destaque', {}, [
      r.agora
        ? el('div', {}, [
            el('div.mini.fraco', { text: 'AGORA' }),
            el('div.item__titulo', { style: 'font-size:17px;margin-top:2px', text: r.agora.titulo }),
            el('div.mini.sub', { text: u.faixa(r.agora.hora, r.agora.duracao) })
          ])
        : el('div', {}, [
            el('div.mini.fraco', { text: 'AGORA' }),
            el('div.item__titulo', { style: 'font-size:17px;margin-top:2px', text: 'Tempo livre' }),
            el('div.mini.sub', { text: 'Nada marcado neste momento.' })
          ]),
      r.proximo ? el('div.mini.sub', { style: 'margin-top:10px;padding-top:10px;border-top:1px solid var(--linha)',
        text: 'A seguir · ' + r.proximo.hora + ' — ' + r.proximo.titulo }) : null

  function cartaoRitual(store, item) {

    var feitos = r.itens.filter(function (i) { return store.feito('itens', i.id, dia); }).length;

      el('div', { style: 'display:flex;align-items:center;gap:10px' }, [
        el('div', { style: 'flex:1' }, [

          el('div.item__meta', {}, [
            r.hora ? el('span', { text: r.hora }) : null,
            el('span', { text: feitos + ' de ' + r.itens.length })

        ]),

      ]),
      el('div.lista-check', {}, r.itens.map(function (i) {
        return ui.linhaCheck(i.titulo, store.feito('itens', i.id, dia), function () {
          store.alternar('itens', i.id, dia);
          App.render();
        });
      }))
    ]);

  /* ------------------------------------------------- períodos - */

  function linhaItem(store, item) {
    var area = store.AREAS[item.area];
    var meta = [ui.ponto(area.cor), el('span', { text: area.nome })];
    if (item.duracao) meta.push(el('span', { text: u.duracaoTexto(item.duracao) }));
    if (item.tipo === 'evento') meta.push(ui.etiqueta('compromisso', 'azul'));
    if (item.fixo && item.tipo !== 'evento') meta.push(ui.etiqueta('fixo'));

    return ui.itemLinha({
      hora: item.hora,
      titulo: item.titulo,
      feito: item.feito,
      nota: item.tipo === 'bloco' ? item.nota : (item.ref.local || item.ref.nota || ''),
      meta: meta,
      aoMarcar: function () {
        store.alternar(item.tipo === 'evento' ? 'eventos' : 'blocos', item.id, dia);
        App.render();
      }
    });
  }

  function periodos(store, motor) {
    var grupos = motor.porPeriodo(dia);
    var out = [];

    PERIODOS.forEach(function (p) {
      var lista = grupos[p.chave];
      if (!lista.length) return;
      var feitos = lista.filter(function (i) { return i.feito; }).length;

      out.push(el('div.periodo', {}, [
        el('div.periodo__titulo', {}, [
          el('span', { text: p.nome }),
          el('em', { text: feitos + '/' + lista.length })
        ]),
        el('div', {}, lista.map(function (i) {
          return i.tipo === 'ritual' ? cartaoRitual(store, i) : linhaItem(store, i);
        }))
      ]));
    });

    if (!out.length) {
      out.push(el('div', { style: 'margin-top:18px' }, [

      ]));

  /* ------------------------------------------------- extras --- */

  function tarefasDoDia(store, motor) {

    var atrasadas = dia === u.hoje()
      ? store.estado.tarefas.filter(function (t) { return !t.feita && t.data && t.data < dia; })
      : [];
    if (!tarefas.length && !atrasadas.length) return [];

    function linha(t, atrasada) {
      return ui.itemLinha({
        titulo: t.titulo,

          el('span', { text: u.duracaoTexto(t.estimativa) }),
          atrasada ? ui.etiqueta('de ' + u.dataCurta(t.data), 'dourada') : null
        ].filter(Boolean),
        aoMarcar: function () {
          store.commit(function () { t.feita = !t.feita; });
          App.render();
        }

    return [
      ui.tituloSecao('Tarefas', u.plural(tarefas.length + atrasadas.length, 'item', 'itens')),
      el('div', {}, atrasadas.map(function (t) { return linha(t, true); })
        .concat(tarefas.map(function (t) { return linha(t, false); })))
    ];
  }

  function cuidadosDoDia(store) {
    if (!store.estado.ajustes.secoes.autocuidado) return [];
    var pendentes = store.cuidadosDeHoje(dia).filter(function (c) { return !store.feito('cuidados', c.id, dia); });
    var feitosHoje = store.estado.cuidados.filter(function (c) { return store.feito('cuidados', c.id, dia); });
    if (!pendentes.length && !feitosHoje.length) return [];

    return [

      el('div.cartao', {}, [
        el('div.lista-check', {}, pendentes.concat(feitosHoje).map(function (c) {

          return ui.linhaCheck(c.titulo, feito, function () {
            store.commit(function () {
              var reg = store.dia(dia);
              if (reg.cuidados[c.id]) { delete reg.cuidados[c.id]; c.ultimaVez = null; }
              else { reg.cuidados[c.id] = true; c.ultimaVez = dia; }
            });
            App.render();
          });
        }))
      ])
    ];
  }

  function espiritualDoDia(store, motor) {
    if (!store.estado.ajustes.secoes.espiritual) return [];
    var praticas = store.estado.espiritual.praticas;
    if (!praticas.length) return [];
    var lit = motor.tempoLiturgico(dia);

    return [
      ui.tituloSecao('Vida espiritual', el('span', { style: 'color:var(--sazonal-forte)', text: lit.tempo })),

          return ui.linhaCheck(p.titulo, store.feito('praticas', p.id, dia), function () {

            App.render();

      ])

  }

  /* ---------------------------------------------- revisão ----- */

  function revisaoDoDia(store) {
    var rev = store.revisao(dia);

    function abrir() {
      ui.abrirFormulario({

          { nome: 'humor', rotulo: 'Como foi o seu dia?', tipo: 'opcoes', opcoes: [
            { valor: 'leve', rotulo: 'Leve' },

            { valor: 'corrido', rotulo: 'Corrido' },

          ] },
          { nome: 'sono', rotulo: 'Horas de sono na noite passada', tipo: 'numero', min: 0, max: 14, passo: 0.5 },
          { nome: 'nota', rotulo: 'Algo que você queira guardar', tipo: 'texto-longo',
            dica: 'O que funcionou hoje? O que pode ficar mais leve amanhã?' }
        ],
        aoSalvar: function (v) {
          store.salvarRevisao(dia, v);
          ui.aviso('Revisão guardada');
          App.render();
        }
      });
    }

    return el('div.cartao', { style: 'margin-top:24px' }, [
      el('div.item__titulo', { text: rev ? 'Revisão do dia guardada' : 'Fechar o dia' }),
      el('p.mini.sub', { style: 'margin-top:4px',
        text: rev
          ? (rev.nota || 'Você registrou como foi este dia.')
          : 'Um minuto para olhar o dia com carinho antes de dormir.' }),
      el('button.btn.btn--p.btn--suave', { style: 'margin-top:10px',
        type: 'button', text: rev ? 'Editar revisão' : 'Revisar o dia', onclick: abrir })

  /* Aviso de rotina atualizada: aplica sem apagar o que já foi feito. */

        return el('div', { style: 'font-family:var(--serif);font-size:15px', text: n });
      })),
      el('p.mini.sub', { style: 'margin-top:8px',
        text: 'Aplicar muda só os horários do quadro. Suas marcações, tarefas, estudos e tudo que você criou continuam como estão.' }),
      el('div.linha-btn', { style: 'margin-top:12px' }, [
        el('button.btn.btn--p.btn--principal', {
          type: 'button', text: 'Aplicar',
          onclick: function () {

          }
        })
      ])
    ]);

  /* "Alternativas e saídas": o que fazer quando o dia não sai como o planejado.

  function alternativas(store) {
    var lista = store.estado.alternativas;
    if (!lista.length) return null;

    return el('div.cartao', { style: 'margin-top:24px;border-left:3px solid var(--ouro)' }, [
      el('div.versalete.fraco', { text: 'Alternativas e saídas' }),
      el('div.pilha.pilha--junta', { style: 'margin-top:10px' }, lista.map(function (a) {

  App.views = App.views || {};
  App.views.hoje = {
    titulo: 'Hoje',
    aoEntrar: function (params) { if (params && params.dia) dia = params.dia; },

        .concat(tarefasDoDia(store, motor))
        .concat(cuidadosDoDia(store))
        .concat(espiritualDoDia(store, motor));
      filhos.push(alternativas(store));
      filhos.push(ui.ornamento());
      filhos.push(revisaoDoDia(store));

      return el('div', {}, filhos.filter(Boolean));
    }
  };

  <script>
/* Tela "Agenda": calendário e rotina no mesmo lugar. */
(function () {
  'use strict';

  var App = window.App;
  var u = App.util, el = u.el, ui = App.ui;

  var dia = null;

  function opcoesArea(store) {
    return Object.keys(store.AREAS).map(function (k) {
      return { valor: k, rotulo: store.AREAS[k].nome };
    });
  }

  /* ------------------------------------------- formulários ---- */

  function formBloco(store, bloco) {
    var novo = !bloco;
    var valores = bloco || { titulo: '', hora: '', duracao: 30, dias: [1, 2, 3, 4, 5], area: 'pessoal', fixo: false, nota: '' };

    ui.abrirFormulario({
      titulo: novo ? 'Nova atividade da rotina' : 'Editar atividade',
      valores: valores,
      campos: [
        { nome: 'titulo', rotulo: 'Atividade', tipo: 'texto', obrigatorio: true, dica: 'Ex.: estudo, escola, jantar' },
        { nome: 'hora', rotulo: 'Horário', tipo: 'hora', junto: true },
        { nome: 'duracao', rotulo: 'Duração (min)', tipo: 'numero', min: 0, passo: 5, junto: true },
        { nome: 'dias', rotulo: 'Dias da semana', tipo: 'dias', obrigatorio: true },
        { nome: 'area', rotulo: 'Área da vida', tipo: 'selecao', opcoes: opcoesArea(store) },
        { nome: 'fixo', rotulo: 'É um horário fixo (o assistente não mexe)', tipo: 'alternar' },
        { nome: 'nota', rotulo: 'Observação', tipo: 'texto-longo', dica: 'Um lembrete para você mesma' }
      ],
      aoExcluir: novo ? null : function () {
        store.commit(function (s) { s.blocos = s.blocos.filter(function (b) { return b.id !== bloco.id; }); });
        ui.aviso('Atividade removida');
        App.render();
      },
      aoSalvar: function (v) {
        store.commit(function (s) {
          if (novo) s.blocos.push(Object.assign({ id: u.id() }, v));
          else Object.assign(bloco, v);
        });
        ui.aviso(novo ? 'Atividade criada' : 'Atividade atualizada');
        App.render();
      }
    });
  }

  function formEvento(store, evento, dataPadrao) {
    var novo = !evento;
    var valores = evento || { titulo: '', data: dataPadrao || dia, hora: '', duracao: 60, area: 'compromisso', local: '', nota: '' };

    ui.abrirFormulario({
      titulo: novo ? 'Novo compromisso' : 'Editar compromisso',
      valores: valores,
      campos: [
        { nome: 'titulo', rotulo: 'Compromisso', tipo: 'texto', obrigatorio: true, dica: 'Ex.: consulta, prova, aniversário' },
        { nome: 'data', rotulo: 'Data', tipo: 'data', obrigatorio: true },
        { nome: 'hora', rotulo: 'Horário', tipo: 'hora', junto: true },
        { nome: 'duracao', rotulo: 'Duração (min)', tipo: 'numero', min: 0, passo: 15, junto: true },
        { nome: 'area', rotulo: 'Área da vida', tipo: 'selecao', opcoes: opcoesArea(store) },
        { nome: 'local', rotulo: 'Onde', tipo: 'texto' },
        { nome: 'nota', rotulo: 'Observação', tipo: 'texto-longo' }
      ],
      aoExcluir: novo ? null : function () {
        store.commit(function (s) { s.eventos = s.eventos.filter(function (e) { return e.id !== evento.id; }); });
        ui.aviso('Compromisso removido');
        App.render();
      },
      aoSalvar: function (v) {
        store.commit(function (s) {
          if (novo) s.eventos.push(Object.assign({ id: u.id() }, v));
          else Object.assign(evento, v);
        });
        dia = v.data;
        ui.aviso(novo ? 'Compromisso marcado' : 'Compromisso atualizado');
        App.render();
      }
    });
  }

  /* ---------------------------------------------- fita semanal */

  function fita(store, motor) {
    var dias = u.diasDaSemana(dia);

    return el('div', {}, [
      el('div.linha-btn', { style: 'align-items:center;margin-bottom:8px' }, [
        el('button.btn.btn--p.btn--fantasma', {
          type: 'button', text: '‹ semana anterior',
          onclick: function () { dia = u.somarDias(dia, -7); App.render(); }
        }),
        el('button.btn.btn--p.btn--fantasma', {
          type: 'button', text: 'próxima ›', style: 'margin-left:auto',
          onclick: function () { dia = u.somarDias(dia, 7); App.render(); }
        })
      ]),
      el('div.semana-fita', {}, dias.map(function (d) {
        var itens = motor.itensDoDia(d);
        var areas = [];
        itens.forEach(function (i) {
          if (areas.indexOf(i.area) === -1 && areas.length < 4) areas.push(i.area);
        });
        return el('div.dia-fita' + (d === dia ? '.ativo' : ''), {
          role: 'button', tabindex: '0',
          onclick: function () { dia = d; App.render(); }
        }, [
          el('div.dia-fita__nome', { text: u.DIAS_MINI[u.diaDaSemana(d)] }),
          el('div.dia-fita__num', { text: String(u.fromISO(d).getDate()) }),
          el('div.dia-fita__pontos', {}, areas.map(function (a) {
            return el('span.dia-fita__ponto', { style: 'background:' + store.AREAS[a].cor });
          }))
        ]);
      }))
    ]);
  }

  /* ------------------------------------------------ lista dia - */

  function listaDoDia(store, motor) {
    var itens = motor.itensDoDia(dia);
    if (!itens.length) {
      return ui.vazio('Dia livre', 'Nada marcado para ' + u.dataRelativa(dia) + '.');
    }

    return el('div', {}, itens.map(function (i) {
      var area = store.AREAS[i.area];
      return ui.itemLinha({
        hora: i.hora,
        titulo: i.titulo,
        feito: i.feito,
        meta: [
          ui.ponto(area.cor),
          el('span', { text: area.nome }),
          i.duracao ? el('span', { text: u.duracaoTexto(i.duracao) }) : null,
          i.tipo === 'evento' ? ui.etiqueta('só neste dia', 'azul') : null,
          i.tipo === 'ritual' ? ui.etiqueta('ritual', 'rosa') : null,
          i.fixo && i.tipo === 'bloco' ? ui.etiqueta('fixo') : null
        ].filter(Boolean),
        aoAbrir: function () {
          if (i.tipo === 'bloco') formBloco(store, i.ref);
          else if (i.tipo === 'evento') formEvento(store, i.ref);
          else location.hash = '#/habitos';
        },
        direita: el('span.fraco', { text: '›' })
      });
    }));
  }

  App.views = App.views || {};
  App.views.agenda = {
    titulo: 'Agenda',
    aoEntrar: function (params) { if (params && params.dia) dia = params.dia; },
    render: function (store) {
      var motor = App.motor;
      if (!dia) dia = u.hoje();

      var ocupado = motor.itensDoDia(dia).reduce(function (s, i) { return s + (i.duracao || 0); }, 0);

      return el('div', {}, [
        fita(store, motor),
        el('div.titulo-secao', {}, [
          el('h2', { text: u.dataLonga(dia) }),
          el('span', { text: ocupado ? u.horasTexto(ocupado) + ' ocupadas' : 'livre' })
        ]),
        listaDoDia(store, motor),
        el('div.linha-btn', { style: 'margin-top:16px' }, [
          el('button.btn.btn--principal.btn--p', {
            type: 'button', text: '+ Compromisso',
            onclick: function () { formEvento(store, null, dia); }
          }),
          el('button.btn.btn--suave.btn--p', {
            type: 'button', text: '+ Atividade da rotina',
            onclick: function () { formBloco(store, null); }
          })
        ]),
        el('p.mini.fraco', { style: 'margin-top:12px',
          text: 'Compromissos valem só para um dia. Atividades da rotina se repetem nos dias marcados.' })
      ]);
    }
  };
})();

      var feitas = todas.filter(function (t) { return t.feita; }).slice().reverse();

      var filtros = [
        { v: 'hoje', r: 'Para hoje' },

      return el('div', {}, [

  <script>
/* Tela "Estudos": disciplina → assunto → conteúdo, com sessões cronometradas. */
(function () {
  'use strict';

  var App = window.App;
  var u = App.util, el = u.el, ui = App.ui;

  var relogio = null;

  var STATUS = {
    nao: { rotulo: 'não estudado', classe: 'st-nao' },
    estudando: { rotulo: 'estudando', classe: 'st-estudando' },
    ok: { rotulo: 'em dia', classe: 'st-ok' }
  };

  /* ------------------------------------------------ cadastros - */

  function formDisciplina(store, disc) {
    var novo = !disc;
    ui.abrirFormulario({
      titulo: novo ? 'Nova disciplina' : 'Editar disciplina',
      valores: disc || { nome: '' },
      campos: [
        { nome: 'nome', rotulo: 'Disciplina', tipo: 'texto', obrigatorio: true, dica: 'Ex.: Biologia' }
      ],
      aoExcluir: novo ? null : function () {
        store.commit(function (s) { s.disciplinas = s.disciplinas.filter(function (d) { return d.id !== disc.id; }); });
        ui.aviso('Disciplina removida');
        App.render();
      },
      aoSalvar: function (v) {
        store.commit(function (s) {
          if (novo) s.disciplinas.push({ id: u.id(), nome: v.nome, emoji: '', topicos: [] });
          else Object.assign(disc, { nome: v.nome });
        });
        App.render();
      }
    });
  }

  function formTopico(store, disc, topico) {
    var novo = !topico;
    ui.abrirFormulario({
      titulo: novo ? 'Novo conteúdo' : 'Editar conteúdo',
      valores: topico || { nome: '', assunto: '', status: 'nao' },
      campos: [
        { nome: 'nome', rotulo: 'Conteúdo', tipo: 'texto', obrigatorio: true, dica: 'Ex.: Leis de Mendel' },
        { nome: 'assunto', rotulo: 'Assunto', tipo: 'texto', dica: 'Ex.: Genética', ajuda: 'Agrupa os conteúdos dentro da disciplina' },
        { nome: 'status', rotulo: 'Como está', tipo: 'opcoes', opcoes: [
          { valor: 'nao', rotulo: 'Não estudado' },
          { valor: 'estudando', rotulo: 'Estudando' },
          { valor: 'ok', rotulo: 'Em dia' }
        ] }
      ],
      aoExcluir: novo ? null : function () {
        store.commit(function () {
          disc.topicos = disc.topicos.filter(function (t) { return t.id !== topico.id; });
        });
        App.render();
      },
      aoSalvar: function (v) {
        store.commit(function () {
          if (novo) disc.topicos.push({ id: u.id(), nome: v.nome, assunto: v.assunto, status: v.status, ultimaRevisao: null, minutos: 0 });
          else Object.assign(topico, { nome: v.nome, assunto: v.assunto, status: v.status });
        });
        App.render();
      }
    });
  }

  /* -------------------------------------------------- sessão -- */

  function comecarSessao(store, disc, topico) {
    store.commit(function (s) {
      s.sessaoAtiva = { disciplinaId: disc.id, topicoId: topico.id, inicio: Date.now() };
    });
    ui.fechar();
    ui.aviso('Sessão iniciada. Bom estudo!');
    App.render();
  }

  function encerrarSessao(store, salvar) {
    var sa = store.estado.sessaoAtiva;
    if (!sa) return;
    var minutos = Math.max(1, Math.round((Date.now() - sa.inicio) / 60000));

    store.commit(function (s) {
      if (salvar) {
        s.sessoes.push({ id: u.id(), data: u.hoje(), disciplinaId: sa.disciplinaId, topicoId: sa.topicoId, minutos: minutos, nota: '' });
        var t = store.topico(sa.topicoId);
        if (t) {
          t.minutos += minutos;
          t.ultimaRevisao = u.hoje();
          if (t.status === 'nao') t.status = 'estudando';
        }
      }
      s.sessaoAtiva = null;
    });

    ui.aviso(salvar ? 'Sessão de ' + u.duracaoTexto(minutos) + ' registrada' : 'Sessão descartada');
    App.render();
  }

  function cronometro(store) {
    var sa = store.estado.sessaoAtiva;
    if (!sa) return null;
    var t = store.topico(sa.topicoId);
    var d = store.disciplinaDoTopico(sa.topicoId);

    var mostrador = el('div.cronometro__tempo', { text: '00:00' });

    function tique() {
      var seg = Math.floor((Date.now() - sa.inicio) / 1000);
      mostrador.textContent = u.pad(Math.floor(seg / 60)) + ':' + u.pad(seg % 60);
    }
    tique();
    clearInterval(relogio);
    relogio = setInterval(tique, 1000);

    return el('div.cronometro', {}, [
      el('div.cronometro__nome', { text: (d ? d.nome + ' · ' : '') + (t ? t.nome : 'Estudo') }),
      mostrador,
      el('div.linha-btn', {}, [
        el('button.btn.btn--p', { type: 'button', text: 'Encerrar e salvar', onclick: function () { encerrarSessao(store, true); } }),
        el('button.btn.btn--p.btn--fantasma', { style: 'color:var(--creme)', type: 'button', text: 'Descartar', onclick: function () { encerrarSessao(store, false); } })
      ])
    ]);
  }

  /* --------------------------------------------- distribuição - */

  function distribuir(store) {
    var pendentes = [];
    store.estado.disciplinas.forEach(function (d) {
      d.topicos.forEach(function (t) {
        if (t.status !== 'ok') pendentes.push({ disc: d, top: t });
      });
    });

    if (!pendentes.length) { ui.aviso('Nenhum conteúdo pendente'); return; }

    var escolhidos = pendentes.map(function (p) { return p.top.id; });
    var lista = el('div.pilha.pilha--junta', {}, pendentes.map(function (p) {
      return ui.linhaCheck(p.top.nome, true, function () { /* trocado abaixo */ });
    }));

    /* Reconstrói a lista para refletir a seleção. */
    function desenhar() {
      lista.innerHTML = '';
      pendentes.forEach(function (p) {
        var dentro = escolhidos.indexOf(p.top.id) !== -1;
        lista.appendChild(ui.linhaCheck(p.disc.nome + ' · ' + p.top.nome, dentro, function () {
          var i = escolhidos.indexOf(p.top.id);
          if (i === -1) escolhidos.push(p.top.id); else escolhidos.splice(i, 1);
          desenhar();
        }));
      });
    }
    desenhar();

    var prazo = el('input', { type: 'date', value: u.somarDias(u.hoje(), 7) });
    var minutos = el('input', { type: 'number', value: '40', min: '10', step: '5' });

    ui.abrirPainel('Distribuir conteúdos', [
      el('p.mini.sub', { text: 'Escolha o que precisa estudar e até quando. O app espalha os conteúdos pelos dias e cria uma tarefa para cada um.' }),
      lista,
      el('div.duo', { style: 'margin-top:12px' }, [
        el('div.campo', {}, [el('label', { text: 'Até quando' }), prazo]),
        el('div.campo', {}, [el('label', { text: 'Minutos por sessão' }), minutos])
      ]),
      el('div.linha-btn.linha-btn--fim', { style: 'margin-top:8px' }, [
        el('button.btn.btn--fantasma', { type: 'button', text: 'Cancelar', onclick: ui.fechar }),
        el('button.btn.btn--principal', {
          type: 'button', text: 'Distribuir',
          onclick: function () {
            if (!escolhidos.length) { ui.aviso('Escolha ao menos um conteúdo'); return; }
            var criadas = App.motor.distribuirEstudos(escolhidos, prazo.value || u.somarDias(u.hoje(), 7), Number(minutos.value) || 40);
            ui.fechar();
            ui.aviso(u.plural(criadas.length, 'sessão distribuída', 'sessões distribuídas'));
            App.render();
          }
        })
      ])
    ]);
  }

  /* ---------------------------------------------------- árvore */

  function acoesTopico(store, disc, topico) {
    ui.abrirPainel(topico.nome, [
      el('p.mini.sub', { text: (topico.assunto ? topico.assunto + ' · ' : '') + disc.nome
        + ' · ' + STATUS[topico.status].rotulo
        + (topico.minutos ? ' · ' + u.horasTexto(topico.minutos) + ' estudadas' : '') }),
      el('div.pilha', { style: 'margin-top:12px' }, [
        store.estado.sessaoAtiva ? el('p.mini.fraco', { text: 'Há uma sessão em andamento. Encerre antes de começar outra.' })
          : el('button.btn.btn--principal.btn--largo', {
              type: 'button', text: '▶ Começar sessão',
              onclick: function () { comecarSessao(store, disc, topico); }
            }),
        el('div.linha-btn', {}, [
          el('button.btn.btn--p.btn--suave', {
            type: 'button', text: 'Marcar como em dia',
            onclick: function () {
              store.commit(function () { topico.status = 'ok'; topico.ultimaRevisao = u.hoje(); });
              ui.fechar(); App.render();
            }
          }),
          el('button.btn.btn--p.btn--suave', {
            type: 'button', text: 'Estudando',
            onclick: function () {
              store.commit(function () { topico.status = 'estudando'; });
              ui.fechar(); App.render();
            }
          }),
          el('button.btn.btn--p.btn--fantasma', {
            type: 'button', text: 'Editar',
            onclick: function () { formTopico(store, disc, topico); }
          })
        ])
      ])
    ]);
  }

  function arvore(store) {
    if (!store.estado.disciplinas.length) {
      return ui.vazio('Nenhuma disciplina ainda', 'Cadastre uma disciplina e vá acrescentando os conteúdos.');
    }

    return el('div.pilha', {}, store.estado.disciplinas.map(function (d) {
      var assuntos = {};
      d.topicos.forEach(function (t) {
        var chave = t.assunto || 'Outros';
        (assuntos[chave] = assuntos[chave] || []).push(t);
      });
      var emDia = d.topicos.filter(function (t) { return t.status === 'ok'; }).length;

      var filhos = [
        el('div.arvore__disciplina', { style: 'cursor:pointer', onclick: function () { formDisciplina(store, d); } }, [
          el('span.monograma', { text: (d.nome || '?').charAt(0).toUpperCase() }),
          el('div', { style: 'flex:1' }, [
            el('div.item__titulo', { text: d.nome }),
            el('div.item__meta', {}, [el('span', { text: emDia + ' de ' + d.topicos.length + ' em dia' })])
          ]),
          el('span.fraco', { text: '›' })
        ])
      ];

      Object.keys(assuntos).forEach(function (assunto) {
        filhos.push(el('div.arvore__assunto', { text: assunto }));
        assuntos[assunto].forEach(function (t) {
          filhos.push(el('div.arvore__topico', { onclick: function () { acoesTopico(store, d, t); } }, [
            el('span.arvore__status.' + STATUS[t.status].classe),
            el('div', { style: 'flex:1' }, [
              el('div', { text: t.nome }),
              t.minutos ? el('div.item__meta', {}, [el('span', { text: u.horasTexto(t.minutos) })]) : null
            ].filter(Boolean)),
            el('span.fraco.mini', { text: '›' })
          ]));
        });
      });

      filhos.push(el('button.btn.btn--p.btn--fantasma', {
        style: 'margin-left:32px;margin-top:8px', type: 'button', text: '+ Conteúdo',
        onclick: function () { formTopico(store, d, null); }
      }));

      return el('div.cartao.arvore', {}, filhos);
    }));
  }

  App.views = App.views || {};
  App.views.estudos = {
    titulo: 'Estudos',
    aoSair: function () { clearInterval(relogio); relogio = null; },
    render: function (store) {
      var dias = u.ultimosDias(7);
      var minutosSemana = store.estado.sessoes
        .filter(function (s) { return dias.indexOf(s.data) !== -1; })
        .reduce(function (soma, s) { return soma + s.minutos; }, 0);

      clearInterval(relogio);

      return el('div', {}, [
        cronometro(store),
        el('div.numeros', { style: 'margin-top:12px' }, [
          el('div.numero', {}, [
            el('div.numero__valor', { text: u.horasTexto(minutosSemana) }),
            el('div.numero__rotulo', { text: 'estudadas em 7 dias' })
          ]),
          el('div.numero', {}, [
            el('div.numero__valor', { text: String(store.estado.sessoes.length) }),
            el('div.numero__rotulo', { text: 'sessões registradas' })
          ])
        ]),

        el('div.linha-btn', { style: 'margin-top:14px' }, [
          el('button.btn.btn--principal.btn--p', {
            type: 'button', text: 'Distribuir conteúdos',
            onclick: function () { distribuir(store); }
          }),
          el('button.btn.btn--suave.btn--p', {
            type: 'button', text: '+ Disciplina',
            onclick: function () { formDisciplina(store, null); }
          })
        ]),

        ui.tituloSecao('Minhas matérias'),
        arvore(store)
      ].filter(Boolean));
    }
  };
})();
